 a north-south direction on the western national border. It borders three states.\n\n2. The state lies in the southwest of Germany on the western national border. It borders four states.\n\n3. The state lies in the middle of Germany in a north-south direction in the western part, but not on the national border. It borders six states.\n\n4. The state lies in the middle of Germany and on no national border. It borders five states."],"x":"Hesse lies in the west-centre, away from any national border, and neighbours six states."},"tr":{"q":"Hessen hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı ülke sınırında yer alır. Üç eyaletle komşudur.\n\n2. Eyalet, Almanya'nın güneybatısında, batı ülke sınırında yer alır. Dört eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı kesimde yer alır; ancak ülke sınırında değildir. Altı eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur."],"x":"Hessen, batı-orta kesimde, hiçbir ülke sınırında olmadan yer alır ve altı eyaletle komşudur."},"ar":{"q":"أيّ ولاية هي هيسن؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الغربية للبلاد. وتجاور ثلاث ولايات.\n\n2. تقع الولاية في جنوب غرب ألمانيا على الحدود الغربية للبلاد. وتجاور أربع ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب في الجزء الغربي، لكنها ليست على حدود البلاد. وتجاور ست ولايات.\n\n4. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات."],"x":"تقع هيسن في الوسط الغربي بعيدًا عن أي حدود للبلاد، وتجاور ست ولايات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der westlichen Staatsgrenze. Es grenzt an drei Bundesländer.\n\n2. Das Bundesland liegt im Südwesten Deutschlands an der westlichen Staatsgrenze. Es grenzt an vier Bundesländer.\n\n3. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland im westlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an sechs Bundesländer.\n\n4. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer."],"x":"Hessen liegt in der westlichen Mitte ohne Staatsgrenze und grenzt an sechs Länder."}},"mecklenburg-vorpommern-1":{"en":{"q":"Which coat of arms belongs to the state of Mecklenburg-Western Pomerania?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms consists of an upright lion facing left, striped red and silver eight times. It has golden claws and a golden crown. The lion is surrounded by eight white stars. The background is blue.","The coat of arms consists of a red eagle seen from the front, with spread wings, looking to the left. Beak and talons are golden yellow, the tongue is red. The background of the coat of arms is white.","The coat of arms is divided in two. In the left half, against a yellow background, is a black bull's head with a golden crown, an open mouth, white teeth, a red tongue and white horns. In the right half, against a white background, is a red griffin with a yellow beak and claws.","The coat of arms shows a white horse leaping to the left on a red background."],"x":"Mecklenburg-Western Pomerania's arms combine a crowned bull's head and a red griffin. The other pictures belong to other states."},"tr":{"q":"Mecklenburg-Vorpommern eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, sola dönük, dik duran, sekiz kez kırmızı ve gümüş renkte şeritli bir aslandan oluşur. Aslanın altın pençeleri ve altın bir tacı vardır. Aslanı sekiz beyaz yıldız çevreler. Zemin mavidir.","Arma, önden görülen, kanatları açık, sola bakan kırmızı bir kartaldan oluşur. Gaga ve pençeler altın sarısı, dil kırmızıdır. Armanın zemini beyazdır.","Arma ikiye bölünmüştür. Sol yarıda sarı zemin üzerinde, altın taçlı, ağzı açık, beyaz dişli, kırmızı dilli ve beyaz boynuzlu siyah bir boğa başı vardır. Sağ yarıda beyaz zemin üzerinde, gagası ve pençeleri sarı olan kırmızı bir grifon bulunur.","Arma, kırmızı zemin üzerinde sola doğru sıçrayan beyaz bir at gösterir."],"x":"Mecklenburg-Vorpommern armasında taçlı bir boğa başı ile kırmızı bir grifon birleşir. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية مكلنبورغ-فوربومرن؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط ثماني مرات بالأحمر والفضي. له مخالب ذهبية وتاج ذهبي، وتحيط به ثماني نجوم بيضاء. الخلفية زرقاء.","يتكوّن الشعار من نسر أحمر يُرى من الأمام بجناحين منشورين وينظر إلى اليسار. المنقار والمخالب بلون أصفر ذهبي واللسان أحمر. خلفية الشعار بيضاء.","الشعار مقسوم إلى نصفين. في النصف الأيسر، على خلفية صفراء، رأس ثور أسود يعلوه تاج ذهبي، فمه مفتوح وأسنانه بيضاء ولسانه أحمر وقرناه أبيضان. وفي النصف الأيمن، على خلفية بيضاء، غريفون أحمر بمنقار ومخالب صفراء.","يُظهر الشعار حصانًا أبيض يقفز نحو اليسار على خلفية حمراء."],"x":"يجمع شعار مكلنبورغ-فوربومرن بين رأس ثور متوّج وغريفون أحمر. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der achtfach rot und silbern gestreift ist. Er hat goldene Krallen und eine goldene Krone. Der Löwe wird von acht weißen Sternen umgeben. Der Hintergrund ist blau.","Das Wappen besteht aus einem roten Adler von vorn mit ausgebreitenten Schwingen und zur linken Seite blickend. Schnabel und Fänge sind gold-gelb, die Zunge rot. Der Hintergrund des Wappens ist weiß.","Das Wappen ist zweigeteilt. In der linken Hälfte befindet sich vor gelbem Hintergrund ein gold gekrönter schwarzer Stierkopf mit aufgerissenem Maul, weißen Zähnen, roter Zunge und weißen Hörnern. In der rechten Hälfte befindet sich vor weißem Hintergrund ein roter Greif mit gelbem Schnabel und Krallen.","Das Wappen zeigt ein nach links springendes weißes Pferd vor rotem Hintergrund."],"x":"Das Wappen von Mecklenburg-Vorpommern vereint den gekrönten Stierkopf und den roten Greif. Die anderen gehören zu anderen Ländern."}},"mecklenburg-vorpommern-8":{"en":{"q":"Which state is Mecklenburg-Western Pomerania?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northern national border of Germany. It borders three states.\n\n2. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n3. The state lies on the northeastern national border of Germany. It borders three states.\n\n4. The state lies on the eastern national border of Germany. It borders five states."],"x":"Mecklenburg-Western Pomerania lies on the Baltic coast in the northeast and neighbours three states: Schleswig-Holstein, Lower Saxony and Brandenburg."},"tr":{"q":"Mecklenburg-Vorpommern hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzey ülke sınırında yer alır. Üç eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n3. Eyalet, Almanya'nın kuzeydoğu ülke sınırında yer alır. Üç eyaletle komşudur.\n\n4. Eyalet, Almanya'nın doğu ülke sınırında yer alır. Beş eyaletle komşudur."],"x":"Mecklenburg-Vorpommern kuzeydoğuda Baltık kıyısında yer alır ve üç eyaletle komşudur: Schleswig-Holstein, Aşağı Saksonya ve Brandenburg."},"ar":{"q":"أيّ ولاية هي مكلنبورغ-فوربومرن؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية لألمانيا. وتجاور ثلاث ولايات.\n\n2. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n3. تقع الولاية على الحدود الشمالية الشرقية لألمانيا. وتجاور ثلاث ولايات.\n\n4. تقع الولاية على الحدود الشرقية لألمانيا. وتجاور خمس ولايات."],"x":"تقع مكلنبورغ-فوربومرن في الشمال الشرقي على ساحل بحر البلطيق وتجاور ثلاث ولايات: شليسفيغ-هولشتاين وساكسونيا السفلى وبراندنبورغ."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nördlichen Staatsgrenze Deutschlands. Es grenzt an drei Bundesländer.\n\n2. Das Bundesland liegt in Ost-West-Ausrichtung mittig in Deutschland im nordöstlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an vier Bundesländer.\n\n3. Das Bundesland liegt an der nordöstlichen Staatsgrenze Deutschlands. Es grenzt an drei Bundesländer.\n\n4. Das Bundesland liegt an der östlichen Staatsgrenze Deutschlands. Es grenzt an fünf Bundesländer."],"x":"Mecklenburg-Vorpommern liegt im Nordosten an der Ostseeküste und grenzt an drei Länder: Schleswig-Holstein, Niedersachsen und Brandenburg."}},"niedersachsen-1":{"en":{"q":"Which coat of arms belongs to the state of Lower Saxony?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms consists of diagonal lozenges in white and blue. A golden crown rests on the coat of arms.","The coat of arms is divided in two. In the left half, one above the other, are two blue lions walking to the right, with red tongues and red claws. The background is yellow. The right half shows a white serrated leaf. The background is red.","The coat of arms shows a white horse leaping to the left on a red background.","The coat of arms is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left."],"x":"Lower Saxony's arms show the white Saxon steed, a leaping white horse on red. The other pictures belong to other states."},"tr":{"q":"Aşağı Saksonya eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, beyaz ve mavi renkli çapraz eşkenar dörtgenlerden oluşur. Armanın üzerinde altın bir taç durur.","Arma ikiye bölünmüştür. Sol yarıda, üst üste iki mavi aslan sağa doğru yürümektedir; dilleri ve pençeleri kırmızıdır. Zemin sarıdır. Sağ yarıda dişli kenarlı beyaz bir yaprak vardır. Zemin kırmızıdır.","Arma, kırmızı zemin üzerinde sola doğru sıçrayan beyaz bir at gösterir.","Arma beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır."],"x":"Aşağı Saksonya armasında kırmızı zemin üzerinde sıçrayan beyaz bir at, yani Sakson atı vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية ساكسونيا السفلى؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن الشعار من معينات مائلة باللونين الأبيض والأزرق. ويعلو الشعار تاج ذهبي.","الشعار مقسوم إلى نصفين. في النصف الأيسر أسدان أزرقان أحدهما فوق الآخر يمشيان نحو اليمين، بألسنة حمراء ومخالب حمراء، والخلفية صفراء. أما النصف الأيمن فتظهر فيه ورقة بيضاء مسنّنة على خلفية حمراء.","يُظهر الشعار حصانًا أبيض يقفز نحو اليسار على خلفية حمراء.","الشعار مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا."],"x":"يحمل شعار ساكسونيا السفلى الحصان الأبيض الساكسوني القافز على خلفية حمراء. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen besteht aus schrägen Rauten in den Farben Weiß und Blau. Auf dem Wappen ruht eine goldene Krone.","Das Wappen ist zweigeteilt. In der linken Hälfte befinden sich übereinander zwei nach rechts schreitende blaue Löwen mit roter Zunge und roten Krallen. Der Hintergrund ist gelb. Die rechte Hälfte zeigt ein weißes gezacktes Blatt. Der Hintergrund ist rot.","Das Wappen zeigt ein nach links springendes weißes Pferd vor rotem Hintergrund.","Das Wappen ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz."],"x":"Das niedersächsische Wappen zeigt das weiße Sachsenross, ein springendes weißes Pferd auf Rot. Die anderen gehören zu anderen Ländern."}},"niedersachsen-8":{"en":{"q":"Which state is Lower Saxony?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the middle of Germany and on no national border. It borders five states.\n\n3. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n4. The state lies in the middle of Germany in a north-south direction on the eastern national border. It borders four states."],"x":"Lower Saxony lies in the northwest on the Dutch border and is the state with the most neighbours: nine."},"tr":{"q":"Aşağı Saksonya hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, doğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Aşağı Saksonya kuzeybatıda Hollanda sınırında yer alır ve dokuz eyaletle komşu olan, en çok komşusu bulunan eyalettir."},"ar":{"q":"أيّ ولاية هي ساكسونيا السفلى؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n4. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع ساكسونيا السفلى في الشمال الغربي على الحدود الهولندية، وهي الولاية الأكثر جوارًا: تسع ولايات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer.\n\n3. Das Bundesland liegt in Ost-West-Ausrichtung mittig in Deutschland im nordöstlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an vier Bundesländer.\n\n4. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der östlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Niedersachsen liegt im Nordwesten an der niederländischen Grenze und hat mit neun die meisten Nachbarländer."}},"nordrhein-westfalen-1":{"en":{"q":"Which coat of arms belongs to the state of North Rhine-Westphalia?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows a white key of Gothic form on a red background. The head of the key is at the lower right, and the bit of the key points to the upper left. A golden crown, decorated with red and green gems, rests on the coat of arms.","The coat of arms is divided in three. The left field shows a white wavy bar on a green background. The right field shows a leaping white horse on a red background. The lower field is smaller and shows a red blossom with yellow sepals on a white background.","The coat of arms is divided in two. The upper field is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left. In the upper right corner is a white field with a black eagle looking to the left. Talons and beak are yellow, the tongue is red. The lower field is white and shows a black bear walking to the left on a red crenellated wall with black joints and an open gate.","The coat of arms shows three black lions walking to the left, with red tongues. The background of the coat of arms is gold. A golden crown rests on top."],"x":"North Rhine-Westphalia's arms combine a wavy bar for the Rhine, the Westphalian horse and the Lippe rose. The other pictures are other states'."},"tr":{"q":"Kuzey Ren-Vestfalya eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, kırmızı zemin üzerinde Gotik biçimli beyaz bir anahtar gösterir. Anahtarın kabzası sağ altta, dişli kısmı sol üste doğrudur. Armanın üzerinde, kırmızı ve yeşil değerli taşlarla süslü altın bir taç durur.","Arma üçe bölünmüştür. Sol alan, yeşil zemin üzerinde beyaz dalgalı bir kuşak gösterir. Sağ alan, kırmızı zemin üzerinde sıçrayan beyaz bir at gösterir. Alttaki alan daha küçüktür ve beyaz zemin üzerinde sarı çanak yapraklı kırmızı bir çiçek gösterir.","Arma ikiye bölünmüştür. Üst alan beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır. Sağ üst köşede, sola bakan siyah bir kartalın bulunduğu beyaz bir alan vardır. Pençeler ve gaga sarı, dil kırmızıdır. Alt alan beyazdır ve kırmızı, siyah derzli, kapısı açık, mazgallı bir surun üzerinde sola doğru yürüyen siyah bir ayı gösterir.","Arma, kırmızı dilli, sola doğru yürüyen üç siyah aslan gösterir. Armanın zemini altın rengindedir. Üstte altın bir taç durur."],"x":"Kuzey Ren-Vestfalya armasında Ren'i simgeleyen dalgalı kuşak, Vestfalya atı ve Lippe gülü birleşir. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية شمال الراين-ويستفاليا؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار مفتاحًا أبيض بشكل قوطي على خلفية حمراء. رأس المفتاح في الأسفل يمينًا وأسنانه تتجه إلى الأعلى يسارًا. ويعلو الشعار تاج ذهبي مزيّن بأحجار كريمة حمراء وخضراء.","الشعار مقسوم إلى ثلاثة أقسام. يُظهر الحقل الأيسر شريطًا أبيض متموجًا على خلفية خضراء. ويُظهر الحقل الأيمن حصانًا أبيض يقفز على خلفية حمراء. أما الحقل السفلي فأصغر ويُظهر زهرة حمراء بسبلات صفراء على خلفية بيضاء.","الشعار مقسوم إلى قسمين. الحقل العلوي مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا. وفي الزاوية العليا اليمنى حقل أبيض فيه نسر أسود ينظر إلى اليسار، مخالبه ومنقاره صفراء ولسانه أحمر. والحقل السفلي أبيض ويُظهر دبًا أسود يمشي نحو اليسار فوق سور أحمر مسنّن ذي فواصل سوداء وبوابة مفتوحة.","يُظهر الشعار ثلاثة أسود سوداء تمشي نحو اليسار بألسنة حمراء. خلفية الشعار ذهبية، ويعلوه تاج ذهبي."],"x":"يجمع شعار شمال الراين-ويستفاليا بين شريط متموج يرمز إلى الراين وحصان ويستفاليا ووردة ليبه. أما الصور الأخرى فلولايات أخرى."},"de":{"g":["Das Wappen zeigt einen weißen Schlüssel gotischer Form auf rotem Hintergrund. Der Schlüsselkopf ist unten rechts, der Schlüsselbart zeigt nach oben links. Auf dem Wappen ruht eine goldene Krone, welche mit roten und grünen Edelsteinen geschmückt ist.","Das Wappen ist dreigeteilt. Das linke Feld zeigt einen weißen gewellten Balken vor grünem Hintergrund. Das rechte Feld zeigt ein springendes weißes Pferd vor rotem Hintergrund. Das untere Feld ist kleiner und zeigt eine rote Blüte mit gelben Kelchblättern vor weißen Hintergrund.","Das Wappen ist zweigeteilt. Das obere Feld ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz. In der oberen rechten Ecke befindet sich ein weißes Feld mit einem schwarzen zur linken Seite blickenden Adler. Die Fänge und der Schnabel sind gelb, die Zunge rot. Das untere Feld ist weiß und zeigt einen nach links schreitenden schwarzen Bären auf einer schwarzgefugten, roten Zinnenmauer mit offenem Tor.","Das Wappen zeigt drei nach links schreitende schwarze Löwen mit roten Zungen. Der Hintergrund des Wappens ist gold. Oben auf dem Wappen ruht eine goldene Krone."],"x":"Das NRW-Wappen vereint den Wellenbalken für den Rhein, das Westfalenross und die Lippische Rose. Die anderen gehören zu anderen Ländern."}},"nordrhein-westfalen-8":{"en":{"q":"Which state is North Rhine-Westphalia?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the southwest of Germany on the western national border. It borders four states.\n\n3. The state lies in the middle of Germany in a north-south direction on the western national border. It borders three states.\n\n4. The state lies in the middle of Germany in a north-south direction in the western part, but not on the national border. It borders six states."],"x":"North Rhine-Westphalia lies in the west on the Dutch and Belgian border and neighbours three states: Lower Saxony, Hesse and Rhineland-Palatinate."},"tr":{"q":"Kuzey Ren-Vestfalya hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın güneybatısında, batı ülke sınırında yer alır. Dört eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı ülke sınırında yer alır. Üç eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı kesimde yer alır; ancak ülke sınırında değildir. Altı eyaletle komşudur."],"x":"Kuzey Ren-Vestfalya batıda Hollanda ve Belçika sınırında yer alır ve üç eyaletle komşudur: Aşağı Saksonya, Hessen ve Rheinland-Pfalz."},"ar":{"q":"أيّ ولاية هي شمال الراين-ويستفاليا؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في جنوب غرب ألمانيا على الحدود الغربية للبلاد. وتجاور أربع ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الغربية للبلاد. وتجاور ثلاث ولايات.\n\n4. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب في الجزء الغربي، لكنها ليست على حدود البلاد. وتجاور ست ولايات."],"x":"تقع شمال الراين-ويستفاليا في الغرب على الحدود الهولندية والبلجيكية وتجاور ثلاث ولايات: ساكسونيا السفلى وهيسن وراينلاند-بالاتينات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt im Südwesten Deutschlands an der westlichen Staatsgrenze. Es grenzt an vier Bundesländer.\n\n3. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der westlichen Staatsgrenze. Es grenzt an drei Bundesländer.\n\n4. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland im westlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an sechs Bundesländer."],"x":"Nordrhein-Westfalen liegt im Westen an der Grenze zu den Niederlanden und Belgien und grenzt an drei Länder: Niedersachsen, Hessen und Rheinland-Pfalz."}},"rheinland-pfalz-1":{"en":{"q":"Which coat of arms belongs to the state of Rhineland-Palatinate?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms is divided in three. The upper left field consists of a red cross on a white background. The upper right field shows a white wheel with six spokes on a red background. The field at the bottom in the middle shows an upright golden lion facing left on a black background; the lion's tongue and claws are red, and on its head it wears a red crown. A golden crown rests on the coat of arms.","The coat of arms shows a white castle with three towers on a red background. The gate is closed. The middle tower has a dome and is taller than the two outer towers. On top of the middle tower is a cross. Above each of the two outer towers hovers a white star.","The coat of arms consists of an upright lion facing left, striped red and silver eight times. It has golden claws and a golden crown. The lion is surrounded by eight white stars. The background is blue.","The coat of arms is divided in two. In the left half, one above the other, are two blue lions walking to the right, with red tongues and red claws. The background is yellow. The right half shows a white serrated leaf. The background is red."],"x":"Rhineland-Palatinate's arms combine the red cross of Trier, the wheel of Mainz and the Palatinate lion. The other pictures are other states'."},"tr":{"q":"Rheinland-Pfalz eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma üçe bölünmüştür. Sol üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sağ üst alan, kırmızı zemin üzerinde altı kollu beyaz bir çark gösterir. Altta ortadaki alan, siyah zemin üzerinde sola dönük, dik duran altın bir aslan gösterir; aslanın dili ve pençeleri kırmızıdır, başında kırmızı bir taç taşır. Armanın üzerinde altın bir taç durur.","Arma, kırmızı zemin üzerinde üç kuleli beyaz bir kale gösterir. Kapı kapalıdır. Ortadaki kulenin bir kubbesi vardır ve yandaki iki kuleden daha yüksektir. Ortadaki kulenin tepesinde bir haç bulunur. Yandaki iki kulenin üzerinde de birer beyaz yıldız asılı durur.","Arma, sola dönük, dik duran, sekiz kez kırmızı ve gümüş renkte şeritli bir aslandan oluşur. Aslanın altın pençeleri ve altın bir tacı vardır. Aslanı sekiz beyaz yıldız çevreler. Zemin mavidir.","Arma ikiye bölünmüştür. Sol yarıda, üst üste iki mavi aslan sağa doğru yürümektedir; dilleri ve pençeleri kırmızıdır. Zemin sarıdır. Sağ yarıda dişli kenarlı beyaz bir yaprak vardır. Zemin kırmızıdır."],"x":"Rheinland-Pfalz armasında Trier'in kırmızı haçı, Mainz çarkı ve Pfalz aslanı birleşir. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية راينلاند-بالاتينات؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["الشعار مقسوم إلى ثلاثة أقسام. الحقل العلوي الأيسر صليب أحمر على خلفية بيضاء. والحقل العلوي الأيمن عجلة بيضاء بست أشعة على خلفية حمراء. والحقل السفلي في الوسط أسد ذهبي منتصب متجه إلى اليسار على خلفية سوداء، لسانه ومخالبه حمراء ويرتدي على رأسه تاجًا أحمر. ويعلو الشعار تاج ذهبي.","يُظهر الشعار قلعة بيضاء بثلاثة أبراج على خلفية حمراء. البوابة مغلقة. للبرج الأوسط قبة وهو أعلى من البرجين الخارجيين. وفي أعلى البرج الأوسط صليب. وفوق كل من البرجين الخارجيين تحوم نجمة بيضاء.","يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط ثماني مرات بالأحمر والفضي. له مخالب ذهبية وتاج ذهبي، وتحيط به ثماني نجوم بيضاء. الخلفية زرقاء.","الشعار مقسوم إلى نصفين. في النصف الأيسر أسدان أزرقان أحدهما فوق الآخر يمشيان نحو اليمين، بألسنة حمراء ومخالب حمراء، والخلفية صفراء. أما النصف الأيمن فتظهر فيه ورقة بيضاء مسنّنة على خلفية حمراء."],"x":"يجمع شعار راينلاند-بالاتينات بين صليب ترير الأحمر وعجلة ماينتس وأسد بالاتينات. أما الصور الأخرى فلولايات أخرى."},"de":{"g":["Das Wappen ist dreigeteilt. Das Feld links oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld rechts oben zeigt ein weißes Rad mit sechs Speichen vor rotem Hintergrund. Das Feld unten in der Mitte zeigt einen nach links gewandten aufrechtstehenden goldenen Löwen vor schwarzem Hintergrund, Zunge und Krallen des Löwen sind rot, auf dem Kopf trägt er eine rote Krone. Auf dem Wappen ruht eine goldene Krone.","Das Wappen zeigt in Weiß eine Burg mit drei Türmen auf rotem Hintergrund. Das Tor ist geschlossen. Der mittlere Turm hat eine Kuppel und ist höher als die beiden äußeren Türme. Oben auf dem mittleren Turm ist ein Kreuz. Über den beiden äußeren Türmen schwebt jeweils ein weißer Stern.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der achtfach rot und silbern gestreift ist. Er hat goldene Krallen und eine goldene Krone. Der Löwe wird von acht weißen Sternen umgeben. Der Hintergrund ist blau.","Das Wappen ist zweigeteilt. In der linken Hälfte befinden sich übereinander zwei nach rechts schreitende blaue Löwen mit roter Zunge und roten Krallen. Der Hintergrund ist gelb. Die rechte Hälfte zeigt ein weißes gezacktes Blatt. Der Hintergrund ist rot."],"x":"Das Wappen von Rheinland-Pfalz vereint das rote Trierer Kreuz, das Mainzer Rad und den Pfälzer Löwen. Die anderen gehören zu anderen Ländern."}},"rheinland-pfalz-8":{"en":{"q":"Which state is Rhineland-Palatinate?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies in the southwest of Germany on the western national border. It borders four states.\n\n2. The state lies in the south of Germany on the southwestern national border. It borders three states.\n\n3. The state lies in the middle of Germany in a north-south direction in the western part, but not on the national border. It borders six states.\n\n4. The state lies in the south of Germany on the southeastern national border. It borders four states."],"x":"Rhineland-Palatinate lies in the southwest on the western border and neighbours four states: North Rhine-Westphalia, Hesse, Baden-Württemberg and Saarland."},"tr":{"q":"Rheinland-Pfalz hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın güneybatısında, batı ülke sınırında yer alır. Dört eyaletle komşudur.\n\n2. Eyalet, Almanya'nın güneyinde, güneybatı ülke sınırında yer alır. Üç eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı kesimde yer alır; ancak ülke sınırında değildir. Altı eyaletle komşudur.\n\n4. Eyalet, Almanya'nın güneyinde, güneydoğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Rheinland-Pfalz güneybatıda, batı sınırında yer alır ve dört eyaletle komşudur: Kuzey Ren-Vestfalya, Hessen, Baden-Württemberg ve Saarland."},"ar":{"q":"أيّ ولاية هي راينلاند-بالاتينات؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية في جنوب غرب ألمانيا على الحدود الغربية للبلاد. وتجاور أربع ولايات.\n\n2. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الغربية للبلاد. وتجاور ثلاث ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب في الجزء الغربي، لكنها ليست على حدود البلاد. وتجاور ست ولايات.\n\n4. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع راينلاند-بالاتينات في الجنوب الغربي على الحدود الغربية وتجاور أربع ولايات: شمال الراين-ويستفاليا وهيسن وبادن-فورتمبيرغ وسارلاند."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt im Südwesten Deutschlands an der westlichen Staatsgrenze. Es grenzt an vier Bundesländer.\n\n2. Das Bundesland liegt im Süden Deutschlands an der südwestlichen Staatsgrenze. Es grenzt an drei Bundesländer.\n\n3. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland im westlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an sechs Bundesländer.\n\n4. Das Bundesland liegt im Süden Deutschlands an der südöstlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Rheinland-Pfalz liegt im Südwesten an der Westgrenze und grenzt an vier Länder: Nordrhein-Westfalen, Hessen, Baden-Württemberg und das Saarland."}},"saarland-1":{"en":{"q":"Which coat of arms belongs to the state of Saarland?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms is divided in three. The upper left field consists of a red cross on a white background. The upper right field shows a white wheel with six spokes on a red background. The field at the bottom in the middle shows an upright golden lion facing left on a black background; the lion's tongue and claws are red, and on its head it wears a red crown. A golden crown rests on the coat of arms.","The coat of arms consists of an upright lion facing left, striped red and white five times. It has golden claws. The background of the coat of arms is blue. A golden crown rests on the coat of arms.","The coat of arms is divided in two. In the left half, against a yellow background, is a black bull's head with a golden crown, an open mouth, white teeth, a red tongue and white horns. In the right half, against a white background, is a red griffin with a yellow beak and claws.","The coat of arms is divided in four. The upper left field shows an upright white lion with a red tongue and a golden crown. The lion is surrounded by white crosses. The background is blue. The upper right field consists of a red cross on a white background. The lower left field shows a red diagonal band running from lower right to upper left. On it are three white eagles. The background is golden. The lower right field shows an upright golden lion with a red crown, red tongue and red claws. The background is black."],"x":"Saarland's arms are divided in four, with the Trier cross, the Saarbrücken lion, the Lorraine eagles and the Palatinate lion. The others are other states'."},"tr":{"q":"Saarland eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma üçe bölünmüştür. Sol üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sağ üst alan, kırmızı zemin üzerinde altı kollu beyaz bir çark gösterir. Altta ortadaki alan, siyah zemin üzerinde sola dönük, dik duran altın bir aslan gösterir; aslanın dili ve pençeleri kırmızıdır, başında kırmızı bir taç taşır. Armanın üzerinde altın bir taç durur.","Arma, sola dönük, dik duran, beşer kez kırmızı ve beyaz şeritli bir aslandan oluşur. Aslanın pençeleri altın rengindedir. Armanın zemini mavidir. Armanın üzerinde altın bir taç durur.","Arma ikiye bölünmüştür. Sol yarıda sarı zemin üzerinde, altın taçlı, ağzı açık, beyaz dişli, kırmızı dilli ve beyaz boynuzlu siyah bir boğa başı vardır. Sağ yarıda beyaz zemin üzerinde, gagası ve pençeleri sarı olan kırmızı bir grifon bulunur.","Arma dörde bölünmüştür. Sol üst alanda, kırmızı dilli, altın taçlı, dik duran beyaz bir aslan görülür. Aslan beyaz haçlarla çevrilidir. Zemin mavidir. Sağ üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sol alt alan, sağ alttan sol üste uzanan kırmızı bir çapraz kuşak gösterir. Üzerinde üç beyaz kartal vardır. Zemin altın rengindedir. Sağ alt alan, kırmızı taçlı, kırmızı dilli ve kırmızı pençeli, dik duran altın bir aslan gösterir. Zemin siyahtır."],"x":"Saarland arması dörde bölünmüştür: Trier haçı, Saarbrücken aslanı, Lothringen kartalları ve Pfalz aslanı. Diğerleri başka eyaletlerin armalarıdır."},"ar":{"q":"أيُّ شعار يخصّ ولاية سارلاند؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["الشعار مقسوم إلى ثلاثة أقسام. الحقل العلوي الأيسر صليب أحمر على خلفية بيضاء. والحقل العلوي الأيمن عجلة بيضاء بست أشعة على خلفية حمراء. والحقل السفلي في الوسط أسد ذهبي منتصب متجه إلى اليسار على خلفية سوداء، لسانه ومخالبه حمراء ويرتدي على رأسه تاجًا أحمر. ويعلو الشعار تاج ذهبي.","يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط خمس مرات بالأحمر والأبيض. له مخالب ذهبية. خلفية الشعار زرقاء، ويعلوه تاج ذهبي.","الشعار مقسوم إلى نصفين. في النصف الأيسر، على خلفية صفراء، رأس ثور أسود يعلوه تاج ذهبي، فمه مفتوح وأسنانه بيضاء ولسانه أحمر وقرناه أبيضان. وفي النصف الأيمن، على خلفية بيضاء، غريفون أحمر بمنقار ومخالب صفراء.","الشعار مقسوم إلى أربعة أقسام. الحقل العلوي الأيسر أسد أبيض منتصب بلسان أحمر وتاج ذهبي، تحيط به صلبان بيضاء، والخلفية زرقاء. والحقل العلوي الأيمن صليب أحمر على خلفية بيضاء. والحقل السفلي الأيسر شريط أحمر مائل يمتد من الأسفل يمينًا إلى الأعلى يسارًا، عليه ثلاثة نسور بيضاء، والخلفية ذهبية. والحقل السفلي الأيمن أسد ذهبي منتصب بتاج أحمر ولسان أحمر ومخالب حمراء، والخلفية سوداء."],"x":"شعار سارلاند مقسوم إلى أربعة أقسام: صليب ترير وأسد ساربروكن ونسور لورين وأسد بالاتينات. أما البقية فلولايات أخرى."},"de":{"g":["Das Wappen ist dreigeteilt. Das Feld links oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld rechts oben zeigt ein weißes Rad mit sechs Speichen vor rotem Hintergrund. Das Feld unten in der Mitte zeigt einen nach links gewandten aufrechtstehenden goldenen Löwen vor schwarzem Hintergrund, Zunge und Krallen des Löwen sind rot, auf dem Kopf trägt er eine rote Krone. Auf dem Wappen ruht eine goldene Krone.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der jeweils fünffach rot und weiß gestreift ist. Er hat goldene Krallen. Der Hintergrund des Wappens ist blau. Auf dem Wappen ruht eine goldene Krone.","Das Wappen ist zweigeteilt. In der linken Hälfte befindet sich vor gelbem Hintergrund ein gold gekrönter schwarzer Stierkopf mit aufgerissenem Maul, weißen Zähnen, roter Zunge und weißen Hörnern. In der rechten Hälfte befindet sich vor weißem Hintergrund ein roter Greif mit gelbem Schnabel und Krallen.","Das Wappen ist viergeteilt. Das Feld links oben zeigt einen aufrechtstehenden weißen Löwen mit roter Zunge und goldener Krone. Der Löwe ist von weißen Kreuzen umgeben. Der Hintergrund ist blau. Das Feld rechts oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld links unten zeigt einen roten Schrägbalken, der von rechts unten nach links oben zeigt. Auf ihm sind drei weiße Adler abgebildet. Der Hintergrund ist golden. Das Feld rechts unten zeigt einen aufrechtstehenden goldenen Löwen mit roter Krone, roter Zunge und roten Krallen. Der Hintergrund ist schwarz."],"x":"Das Saarland-Wappen ist viergeteilt: Trierer Kreuz, Saarbrücker Löwe, Lothringer Adler und Pfälzer Löwe. Die anderen gehören zu anderen Ländern."}},"saarland-8":{"en":{"q":"Which state is Saarland?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state is small and lies in the northwestern part of Germany. It borders one state.\n\n2. The state is small and lies in the southwest of Germany on the national border. It borders one state.\n\n3. The state is small and lies in the middle of Germany in the north, in an east-west direction, but on no national border. It borders two states.\n\n4. The state is small and lies in the eastern part of Germany, but not on the national border. It borders one state."],"x":"Saarland is a small state in the southwest on the French and Luxembourg border. Its only neighbouring state is Rhineland-Palatinate."},"tr":{"q":"Saarland hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet küçüktür ve Almanya'nın kuzeybatı kesiminde yer alır. Bir eyaletle komşudur.\n\n2. Eyalet küçüktür ve Almanya'nın güneybatısında, ülke sınırında yer alır. Bir eyaletle komşudur.\n\n3. Eyalet küçüktür ve Almanya'nın kuzeyinde, doğu-batı doğrultusunda ortada yer alır; ancak hiçbir ülke sınırında değildir. İki eyaletle komşudur.\n\n4. Eyalet küçüktür ve Almanya'nın doğu kesiminde yer alır; ancak ülke sınırında değildir. Bir eyaletle komşudur."],"x":"Saarland, güneybatıda Fransa ve Lüksemburg sınırında yer alan küçük bir eyalettir. Tek komşu eyaleti Rheinland-Pfalz'dır."},"ar":{"q":"أيّ ولاية هي سارلاند؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. الولاية صغيرة وتقع في الجزء الشمالي الغربي من ألمانيا. وتجاور ولاية واحدة.\n\n2. الولاية صغيرة وتقع في جنوب غرب ألمانيا على حدود البلاد. وتجاور ولاية واحدة.\n\n3. الولاية صغيرة وتقع في وسط ألمانيا في الشمال بامتداد من الشرق إلى الغرب، لكنها ليست على أي حدود للبلاد. وتجاور ولايتين.\n\n4. الولاية صغيرة وتقع في الجزء الشرقي من ألمانيا، لكنها ليست على حدود البلاد. وتجاور ولاية واحدة."],"x":"سارلاند ولاية صغيرة في الجنوب الغربي على الحدود الفرنسية واللوكسمبورغية، وجارتها الوحيدة هي راينلاند-بالاتينات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland ist klein und liegt im nordwestlichen Teil Deutschlands. Es grenzt an ein Bundesland.\n\n2. Das Bundesland ist klein und liegt im Südwesten Deutschlands an der Staatsgrenze. Es grenzt an ein Bundesland.\n\n3. Das Bundesland ist klein und liegt in Ost-West-Ausrichtung mittig in Deutschland im Norden, aber an keiner Staatsgrenze. Es grenzt an zwei Bundesländer.\n\n4. Das Bundesland ist klein und liegt in Deutschland im östlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an ein Bundesland."],"x":"Das Saarland ist ein kleines Land im Südwesten an der Grenze zu Frankreich und Luxemburg. Sein einziges Nachbarland ist Rheinland-Pfalz."}},"sachsen-1":{"en":{"q":"Which coat of arms belongs to the Free State of Saxony?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms consists of diagonal lozenges in white and blue. A golden crown rests on the coat of arms.","The coat of arms consists of an upright black bear facing left, with a red tongue and red claws. The background of the coat of arms is white. A golden crown rests on the coat of arms.","The coat of arms shows a white horse leaping to the left on a red background.","The coat of arms is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left."],"x":"Saxony's arms show black and yellow stripes crossed by a green rue-wreath. The other pictures belong to other states."},"tr":{"q":"Saksonya Serbest Eyaleti'ne hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, beyaz ve mavi renkli çapraz eşkenar dörtgenlerden oluşur. Armanın üzerinde altın bir taç durur.","Arma, sola dönük, dik duran, kırmızı dilli ve kırmızı pençeli siyah bir ayıdan oluşur. Armanın zemini beyazdır. Armanın üzerinde altın bir taç durur.","Arma, kırmızı zemin üzerinde sola doğru sıçrayan beyaz bir at gösterir.","Arma beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır."],"x":"Saksonya armasında siyah-sarı şeritleri çaprazlayan yeşil bir sedef otu çelengi vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية ساكسونيا الحرة؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن الشعار من معينات مائلة باللونين الأبيض والأزرق. ويعلو الشعار تاج ذهبي.","يتكوّن الشعار من دب أسود منتصب متجه إلى اليسار بلسان أحمر ومخالب حمراء. خلفية الشعار بيضاء، ويعلوه تاج ذهبي.","يُظهر الشعار حصانًا أبيض يقفز نحو اليسار على خلفية حمراء.","الشعار مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا."],"x":"يحمل شعار ساكسونيا خطوطًا سوداء وصفراء يقطعها إكليل أخضر من أوراق السذاب. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen besteht aus schrägen Rauten in den Farben Weiß und Blau. Auf dem Wappen ruht eine goldene Krone.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden schwarzen Bären mit roter Zunge und roten Krallen. Der Hintergrund des Wappens ist weiß. Auf dem Wappen ruht eine goldene Krone.","Das Wappen zeigt ein nach links springendes weißes Pferd vor rotem Hintergrund.","Das Wappen ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz."],"x":"Das sächsische Wappen zeigt schwarz-gelbe Streifen mit grünem Rautenkranz. Die anderen Bilder gehören zu anderen Ländern."}},"sachsen-8":{"en":{"q":"Which state is Saxony?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the middle of Germany and on no national border. It borders five states.\n\n3. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n4. The state lies in the middle of Germany in a north-south direction on the eastern national border. It borders four states."],"x":"Saxony lies in the east on the Polish and Czech border and neighbours four states: Brandenburg, Saxony-Anhalt, Thuringia and Bavaria."},"tr":{"q":"Saksonya hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, doğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Saksonya doğuda Polonya ve Çekya sınırında yer alır ve dört eyaletle komşudur: Brandenburg, Saksonya-Anhalt, Türingiya ve Bavyera."},"ar":{"q":"أيّ ولاية هي ساكسونيا؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n4. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع ساكسونيا في الشرق على الحدود البولندية والتشيكية وتجاور أربع ولايات: براندنبورغ وساكسونيا-أنهالت وتورينغن وبافاريا."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer.\n\n3. Das Bundesland liegt in Ost-West-Ausrichtung mittig in Deutschland im nordöstlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an vier Bundesländer.\n\n4. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der östlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Sachsen liegt im Osten an der Grenze zu Polen und Tschechien und grenzt an vier Länder: Brandenburg, Sachsen-Anhalt, Thüringen und Bayern."}},"sachsen-anhalt-1":{"en":{"q":"Which coat of arms belongs to the state of Saxony-Anhalt?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms consists of diagonal lozenges in white and blue. A golden crown rests on the coat of arms.","The coat of arms shows a white castle with three towers on a red background. The gate is closed. The middle tower has a dome and is taller than the two outer towers. On top of the middle tower is a cross. Above each of the two outer towers hovers a white star.","The coat of arms is divided in three. The upper left field consists of a red cross on a white background. The upper right field shows a white wheel with six spokes on a red background. The field at the bottom in the middle shows an upright golden lion facing left on a black background; the lion's tongue and claws are red, and on its head it wears a red crown. A golden crown rests on the coat of arms.","The coat of arms is divided in two. The upper field is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left. In the upper right corner is a white field with a black eagle looking to the left. Talons and beak are yellow, the tongue is red. The lower field is white and shows a black bear walking to the left on a red crenellated wall with black joints and an open gate."],"x":"Saxony-Anhalt's arms combine Saxon stripes with the rue-wreath, the Brandenburg eagle and the Anhalt bear on a wall. The others are other states'."},"tr":{"q":"Saksonya-Anhalt eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, beyaz ve mavi renkli çapraz eşkenar dörtgenlerden oluşur. Armanın üzerinde altın bir taç durur.","Arma, kırmızı zemin üzerinde üç kuleli beyaz bir kale gösterir. Kapı kapalıdır. Ortadaki kulenin bir kubbesi vardır ve yandaki iki kuleden daha yüksektir. Ortadaki kulenin tepesinde bir haç bulunur. Yandaki iki kulenin üzerinde de birer beyaz yıldız asılı durur.","Arma üçe bölünmüştür. Sol üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sağ üst alan, kırmızı zemin üzerinde altı kollu beyaz bir çark gösterir. Altta ortadaki alan, siyah zemin üzerinde sola dönük, dik duran altın bir aslan gösterir; aslanın dili ve pençeleri kırmızıdır, başında kırmızı bir taç taşır. Armanın üzerinde altın bir taç durur.","Arma ikiye bölünmüştür. Üst alan beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır. Sağ üst köşede, sola bakan siyah bir kartalın bulunduğu beyaz bir alan vardır. Pençeler ve gaga sarı, dil kırmızıdır. Alt alan beyazdır ve kırmızı, siyah derzli, kapısı açık, mazgallı bir surun üzerinde sola doğru yürüyen siyah bir ayı gösterir."],"x":"Saksonya-Anhalt armasında Sakson şeritleri ve çelenk, Brandenburg kartalı ve surun üzerindeki Anhalt ayısı birleşir. Diğerleri başka eyaletlerin armalarıdır."},"ar":{"q":"أيُّ شعار يخصّ ولاية ساكسونيا-أنهالت؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن الشعار من معينات مائلة باللونين الأبيض والأزرق. ويعلو الشعار تاج ذهبي.","يُظهر الشعار قلعة بيضاء بثلاثة أبراج على خلفية حمراء. البوابة مغلقة. للبرج الأوسط قبة وهو أعلى من البرجين الخارجيين. وفي أعلى البرج الأوسط صليب. وفوق كل من البرجين الخارجيين تحوم نجمة بيضاء.","الشعار مقسوم إلى ثلاثة أقسام. الحقل العلوي الأيسر صليب أحمر على خلفية بيضاء. والحقل العلوي الأيمن عجلة بيضاء بست أشعة على خلفية حمراء. والحقل السفلي في الوسط أسد ذهبي منتصب متجه إلى اليسار على خلفية سوداء، لسانه ومخالبه حمراء ويرتدي على رأسه تاجًا أحمر. ويعلو الشعار تاج ذهبي.","الشعار مقسوم إلى قسمين. الحقل العلوي مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا. وفي الزاوية العليا اليمنى حقل أبيض فيه نسر أسود ينظر إلى اليسار، مخالبه ومنقاره صفراء ولسانه أحمر. والحقل السفلي أبيض ويُظهر دبًا أسود يمشي نحو اليسار فوق سور أحمر مسنّن ذي فواصل سوداء وبوابة مفتوحة."],"x":"يجمع شعار ساكسونيا-أنهالت بين خطوط ساكسونيا وإكليلها ونسر براندنبورغ ودب أنهالت فوق السور. أما البقية فلولايات أخرى."},"de":{"g":["Das Wappen besteht aus schrägen Rauten in den Farben Weiß und Blau. Auf dem Wappen ruht eine goldene Krone.","Das Wappen zeigt in Weiß eine Burg mit drei Türmen auf rotem Hintergrund. Das Tor ist geschlossen. Der mittlere Turm hat eine Kuppel und ist höher als die beiden äußeren Türme. Oben auf dem mittleren Turm ist ein Kreuz. Über den beiden äußeren Türmen schwebt jeweils ein weißer Stern.","Das Wappen ist dreigeteilt. Das Feld links oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld rechts oben zeigt ein weißes Rad mit sechs Speichen vor rotem Hintergrund. Das Feld unten in der Mitte zeigt einen nach links gewandten aufrechtstehenden goldenen Löwen vor schwarzem Hintergrund, Zunge und Krallen des Löwen sind rot, auf dem Kopf trägt er eine rote Krone. Auf dem Wappen ruht eine goldene Krone.","Das Wappen ist zweigeteilt. Das obere Feld ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz. In der oberen rechten Ecke befindet sich ein weißes Feld mit einem schwarzen zur linken Seite blickenden Adler. Die Fänge und der Schnabel sind gelb, die Zunge rot. Das untere Feld ist weiß und zeigt einen nach links schreitenden schwarzen Bären auf einer schwarzgefugten, roten Zinnenmauer mit offenem Tor."],"x":"Das Wappen von Sachsen-Anhalt vereint sächsische Streifen mit Rautenkranz, brandenburgischen Adler und anhaltischen Bären auf der Mauer. Die anderen gehören zu anderen Ländern."}},"sachsen-anhalt-8":{"en":{"q":"Which state is Saxony-Anhalt?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the middle of Germany and on no national border. It borders five states.\n\n3. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n4. The state lies in the middle of Germany in a north-south direction on the eastern national border. It borders four states."],"x":"Saxony-Anhalt lies in the east-centre without a national border and neighbours four states: Lower Saxony, Brandenburg, Saxony and Thuringia."},"tr":{"q":"Saksonya-Anhalt hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, doğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Saksonya-Anhalt, doğu-orta kesimde, ülke sınırı olmadan yer alır ve dört eyaletle komşudur: Aşağı Saksonya, Brandenburg, Saksonya ve Türingiya."},"ar":{"q":"أيّ ولاية هي ساكسونيا-أنهالت؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n4. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع ساكسونيا-أنهالت في الوسط الشرقي دون حدود دولية وتجاور أربع ولايات: ساكسونيا السفلى وبراندنبورغ وساكسونيا وتورينغن."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer.\n\n3. Das Bundesland liegt in Ost-West-Ausrichtung mittig in Deutschland im nordöstlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an vier Bundesländer.\n\n4. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der östlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Sachsen-Anhalt liegt in der östlichen Mitte ohne Staatsgrenze und grenzt an vier Länder: Niedersachsen, Brandenburg, Sachsen und Thüringen."}},"schleswig-holstein-1":{"en":{"q":"Which coat of arms belongs to the state of Schleswig-Holstein?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms is divided in four. The upper left field shows an upright white lion with a red tongue and a golden crown. The lion is surrounded by white crosses. The background is blue. The upper right field consists of a red cross on a white background. The lower left field shows a red diagonal band running from lower right to upper left. On it are three white eagles. The background is golden. The lower right field shows an upright golden lion with a red crown, red tongue and red claws. The background is black.","The coat of arms consists of an upright black bear facing left, with a red tongue and red claws. The background of the coat of arms is white. A golden crown rests on the coat of arms.","The coat of arms is divided in two. In the left half, one above the other, are two blue lions walking to the right, with red tongues and red claws. The background is yellow. The right half shows a white serrated leaf. The background is red.","The coat of arms consists of an upright lion facing left, striped red and silver eight times. It has golden claws and a golden crown. The lion is surrounded by eight white stars. The background is blue."],"x":"Schleswig-Holstein's arms show two blue lions on yellow beside a white nettle leaf on red. The other pictures belong to other states."},"tr":{"q":"Schleswig-Holstein eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma dörde bölünmüştür. Sol üst alanda, kırmızı dilli, altın taçlı, dik duran beyaz bir aslan görülür. Aslan beyaz haçlarla çevrilidir. Zemin mavidir. Sağ üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sol alt alan, sağ alttan sol üste uzanan kırmızı bir çapraz kuşak gösterir. Üzerinde üç beyaz kartal vardır. Zemin altın rengindedir. Sağ alt alan, kırmızı taçlı, kırmızı dilli ve kırmızı pençeli, dik duran altın bir aslan gösterir. Zemin siyahtır.","Arma, sola dönük, dik duran, kırmızı dilli ve kırmızı pençeli siyah bir ayıdan oluşur. Armanın zemini beyazdır. Armanın üzerinde altın bir taç durur.","Arma ikiye bölünmüştür. Sol yarıda, üst üste iki mavi aslan sağa doğru yürümektedir; dilleri ve pençeleri kırmızıdır. Zemin sarıdır. Sağ yarıda dişli kenarlı beyaz bir yaprak vardır. Zemin kırmızıdır.","Arma, sola dönük, dik duran, sekiz kez kırmızı ve gümüş renkte şeritli bir aslandan oluşur. Aslanın altın pençeleri ve altın bir tacı vardır. Aslanı sekiz beyaz yıldız çevreler. Zemin mavidir."],"x":"Schleswig-Holstein armasında sarı zeminde iki mavi aslan ile kırmızı zeminde beyaz bir ısırgan yaprağı yan yanadır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية شليسفيغ-هولشتاين؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["الشعار مقسوم إلى أربعة أقسام. الحقل العلوي الأيسر أسد أبيض منتصب بلسان أحمر وتاج ذهبي، تحيط به صلبان بيضاء، والخلفية زرقاء. والحقل العلوي الأيمن صليب أحمر على خلفية بيضاء. والحقل السفلي الأيسر شريط أحمر مائل يمتد من الأسفل يمينًا إلى الأعلى يسارًا، عليه ثلاثة نسور بيضاء، والخلفية ذهبية. والحقل السفلي الأيمن أسد ذهبي منتصب بتاج أحمر ولسان أحمر ومخالب حمراء، والخلفية سوداء.","يتكوّن الشعار من دب أسود منتصب متجه إلى اليسار بلسان أحمر ومخالب حمراء. خلفية الشعار بيضاء، ويعلوه تاج ذهبي.","الشعار مقسوم إلى نصفين. في النصف الأيسر أسدان أزرقان أحدهما فوق الآخر يمشيان نحو اليمين، بألسنة حمراء ومخالب حمراء، والخلفية صفراء. أما النصف الأيمن فتظهر فيه ورقة بيضاء مسنّنة على خلفية حمراء.","يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط ثماني مرات بالأحمر والفضي. له مخالب ذهبية وتاج ذهبي، وتحيط به ثماني نجوم بيضاء. الخلفية زرقاء."],"x":"يضم شعار شليسفيغ-هولشتاين أسدين أزرقين على خلفية صفراء بجانب ورقة قراص بيضاء على خلفية حمراء. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen ist viergeteilt. Das Feld links oben zeigt einen aufrechtstehenden weißen Löwen mit roter Zunge und goldener Krone. Der Löwe ist von weißen Kreuzen umgeben. Der Hintergrund ist blau. Das Feld rechts oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld links unten zeigt einen roten Schrägbalken, der von rechts unten nach links oben zeigt. Auf ihm sind drei weiße Adler abgebildet. Der Hintergrund ist golden. Das Feld rechts unten zeigt einen aufrechtstehenden goldenen Löwen mit roter Krone, roter Zunge und roten Krallen. Der Hintergrund ist schwarz.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden schwarzen Bären mit roter Zunge und roten Krallen. Der Hintergrund des Wappens ist weiß. Auf dem Wappen ruht eine goldene Krone.","Das Wappen ist zweigeteilt. In der linken Hälfte befinden sich übereinander zwei nach rechts schreitende blaue Löwen mit roter Zunge und roten Krallen. Der Hintergrund ist gelb. Die rechte Hälfte zeigt ein weißes gezacktes Blatt. Der Hintergrund ist rot.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der achtfach rot und silbern gestreift ist. Er hat goldene Krallen und eine goldene Krone. Der Löwe wird von acht weißen Sternen umgeben. Der Hintergrund ist blau."],"x":"Das Wappen von Schleswig-Holstein zeigt zwei blaue Löwen auf Gelb neben einem weißen Nesselblatt auf Rot. Die anderen gehören zu anderen Ländern."}},"schleswig-holstein-8":{"en":{"q":"Which state is Schleswig-Holstein?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northern national border of Germany. It borders three states.\n\n2. The state lies on the northwestern national border of Germany. It borders nine states.\n\n3. The state lies on the northeastern national border of Germany. It borders three states.\n\n4. The state lies on the eastern national border of Germany. It borders five states."],"x":"Schleswig-Holstein is the northernmost state, on the Danish border, and neighbours three states: Hamburg, Lower Saxony and Mecklenburg-Western Pomerania."},"tr":{"q":"Schleswig-Holstein hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzey ülke sınırında yer alır. Üç eyaletle komşudur.\n\n2. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n3. Eyalet, Almanya'nın kuzeydoğu ülke sınırında yer alır. Üç eyaletle komşudur.\n\n4. Eyalet, Almanya'nın doğu ülke sınırında yer alır. Beş eyaletle komşudur."],"x":"Schleswig-Holstein, Danimarka sınırında yer alan en kuzeydeki eyalettir ve üç eyaletle komşudur: Hamburg, Aşağı Saksonya ve Mecklenburg-Vorpommern."},"ar":{"q":"أيّ ولاية هي شليسفيغ-هولشتاين؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية لألمانيا. وتجاور ثلاث ولايات.\n\n2. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n3. تقع الولاية على الحدود الشمالية الشرقية لألمانيا. وتجاور ثلاث ولايات.\n\n4. تقع الولاية على الحدود الشرقية لألمانيا. وتجاور خمس ولايات."],"x":"شليسفيغ-هولشتاين أقصى ولاية شمالية على الحدود الدنماركية، وتجاور ثلاث ولايات: هامبورغ وساكسونيا السفلى ومكلنبورغ-فوربومرن."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nördlichen Staatsgrenze Deutschlands. Es grenzt an drei Bundesländer.\n\n2. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n3. Das Bundesland liegt an der nordöstlichen Staatsgrenze Deutschlands. Es grenzt an drei Bundesländer.\n\n4. Das Bundesland liegt an der östlichen Staatsgrenze Deutschlands. Es grenzt an fünf Bundesländer."],"x":"Schleswig-Holstein ist das nördlichste Land an der Grenze zu Dänemark und grenzt an drei Länder: Hamburg, Niedersachsen und Mecklenburg-Vorpommern."}},"thueringen-1":{"en":{"q":"Which coat of arms belongs to the Free State of Thuringia?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows three black lions walking to the left, with red tongues. The background of the coat of arms is gold. A golden crown rests on top.","The coat of arms is divided in two. In the left half, against a yellow background, is a black bull's head with a golden crown, an open mouth, white teeth, a red tongue and white horns. In the right half, against a white background, is a red griffin with a yellow beak and claws.","The coat of arms is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left.","The coat of arms consists of an upright lion facing left, striped red and silver eight times. It has golden claws and a golden crown. The lion is surrounded by eight white stars. The background is blue."],"x":"Thuringia's arms show the red-and-silver striped lion ringed by eight white stars on blue. The other pictures belong to other states."},"tr":{"q":"Türingiya Serbest Eyaleti'ne hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, kırmızı dilli, sola doğru yürüyen üç siyah aslan gösterir. Armanın zemini altın rengindedir. Üstte altın bir taç durur.","Arma ikiye bölünmüştür. Sol yarıda sarı zemin üzerinde, altın taçlı, ağzı açık, beyaz dişli, kırmızı dilli ve beyaz boynuzlu siyah bir boğa başı vardır. Sağ yarıda beyaz zemin üzerinde, gagası ve pençeleri sarı olan kırmızı bir grifon bulunur.","Arma beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır.","Arma, sola dönük, dik duran, sekiz kez kırmızı ve gümüş renkte şeritli bir aslandan oluşur. Aslanın altın pençeleri ve altın bir tacı vardır. Aslanı sekiz beyaz yıldız çevreler. Zemin mavidir."],"x":"Türingiya armasında mavi zeminde, sekiz beyaz yıldızla çevrili kırmızı-gümüş şeritli aslan vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية تورينغن الحرة؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار ثلاثة أسود سوداء تمشي نحو اليسار بألسنة حمراء. خلفية الشعار ذهبية، ويعلوه تاج ذهبي.","الشعار مقسوم إلى نصفين. في النصف الأيسر، على خلفية صفراء، رأس ثور أسود يعلوه تاج ذهبي، فمه مفتوح وأسنانه بيضاء ولسانه أحمر وقرناه أبيضان. وفي النصف الأيمن، على خلفية بيضاء، غريفون أحمر بمنقار ومخالب صفراء.","الشعار مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا.","يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط ثماني مرات بالأحمر والفضي. له مخالب ذهبية وتاج ذهبي، وتحيط به ثماني نجوم بيضاء. الخلفية زرقاء."],"x":"يحمل شعار تورينغن الأسد المخطّط بالأحمر والفضي تحيط به ثماني نجوم بيضاء على خلفية زرقاء. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen zeigt drei nach links schreitende schwarze Löwen mit roten Zungen. Der Hintergrund des Wappens ist gold. Oben auf dem Wappen ruht eine goldene Krone.","Das Wappen ist zweigeteilt. In der linken Hälfte befindet sich vor gelbem Hintergrund ein gold gekrönter schwarzer Stierkopf mit aufgerissenem Maul, weißen Zähnen, roter Zunge und weißen Hörnern. In der rechten Hälfte befindet sich vor weißem Hintergrund ein roter Greif mit gelbem Schnabel und Krallen.","Das Wappen ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der achtfach rot und silbern gestreift ist. Er hat goldene Krallen und eine goldene Krone. Der Löwe wird von acht weißen Sternen umgeben. Der Hintergrund ist blau."],"x":"Das Thüringer Wappen zeigt den rot-silbern gestreiften Löwen, umgeben von acht weißen Sternen auf Blau. Die anderen gehören zu anderen Ländern."}},"thueringen-8":{"en":{"q":"Which state is Thuringia?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the middle of Germany and on no national border. It borders five states.\n\n3. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n4. The state lies in the middle of Germany in a north-south direction on the eastern national border. It borders four states."],"x":"Thuringia lies at the heart of Germany with no national border and neighbours five states: Lower Saxony, Saxony-Anhalt, Saxony, Bavaria and Hesse."},"tr":{"q":"Türingiya hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n4. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, doğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Türingiya, Almanya'nın kalbinde, hiçbir ülke sınırı olmadan yer alır ve beş eyaletle komşudur: Aşağı Saksonya, Saksonya-Anhalt, Saksonya, Bavyera ve Hessen."},"ar":{"q":"أيّ ولاية هي تورينغن؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n4. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب على الحدود الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع تورينغن في قلب ألمانيا دون أي حدود دولية وتجاور خمس ولايات: ساكسونيا السفلى وساكسونيا-أنهالت وساكسونيا وبافاريا وهيسن."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer.\n\n3. Das Bundesland liegt in Ost-West-Ausrichtung mittig in Deutschland im nordöstlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an vier Bundesländer.\n\n4. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland an der östlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Thüringen liegt im Herzen Deutschlands ohne Staatsgrenze und grenzt an fünf Länder: Niedersachsen, Sachsen-Anhalt, Sachsen, Bayern und Hessen."}}};

}
function optHtml(q,i,cls,attr){
  const tr=tx(q),G=(T[q.id]||{}).de?.g;
  return `<li><button class="opt ${cls}" data-i="${i}" ${attr}><span lang="de" dir="ltr" style="text-align:start">${esc(q.o[i])}</span>${tr?`<small>${esc(tr.o[i])}</small>`:""}${G&&G.length===4?`<small lang="de" dir="ltr" style="text-align:start">${esc(G[i])}</small>${tr&&tr.g?`<small>${esc(tr.g[i])}</small>`:""}`:""}</button></li>`;
}
function practice(q){
  const done=S.picked!==null;
  let h=qHead(q)+`<ul class="opts">`;
  q.o.forEach((_,i)=>{const c=done?(i===q.c?"ok":i===S.picked?"no":""):"";h+=optHtml(q,i,c,done?"disabled":"")});
  h+="</ul>";
  if(done){h+=`<p role="status"><b>${S.picked===q.c?t("right"):t("wrong")}</b></p>`;if(exp(q))h+=`<p class="note">${esc(exp(q))}</p>`}
  return h;
}
function answer(q,i){S.picked=i;S.res[q.id]=i===q.c;save("res",S.res);render()}
function bindOpts(fn){document.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>fn(+b.dataset.i))}

function vHome(){
  const p=pool(),ok=p.filter(q=>S.res[q.id]).length,q=dayQ();
  $("app").innerHTML=`<div class="stack"><h1>${t("hero")}</h1><p>${t("sub")}</p></div>
  <section class="sheet"><label for="st"><h2>${t("state")}</h2></label>
    <select id="st">${Object.entries(K.states).map(([k,v])=>`<option value="${k}" ${k===S.state?"selected":""}>${esc(v.name)}</option>`).join("")}</select>
    <div class="bar" aria-hidden="true"><i style="width:${ok/p.length*100}%"></i></div>
    <p class="muted">${t("learned",{a:ok,b:p.length})}</p></section>
  <section class="sheet"><h2>${t("today")}</h2>${practice(q)}</section>
  <section class="sheet"><p>${t("examInfo")}</p><button class="btn" id="go">${t("startExam")}</button></section>`;
  $("st").onchange=e=>{S.state=e.target.value;save("state",S.state);render()};
  $("go").onclick=startExam;
  bindOpts(i=>answer(q,i));
}
function list(){
  const p=pool();
  if(S.filter==="translated")return p.filter(q=>T[q.id]);
  if(S.filter==="wrongs")return p.filter(q=>S.res[q.id]===false);
  return p;
}
function vStudy(){
  const l=list(),f=`<label for="fl" class="muted">${t("filter")}</label><select id="fl">${["all","wrongs"].map(k=>`<option value="${k}" ${k===S.filter?"selected":""}>${t(k==="wrongs"?"wrongs":k)}</option>`).join("")}</select>`;
  if(!l.length){$("app").innerHTML=`<div class="stack">${f}<p class="sheet">${t("none")}</p></div>`}
  else{
    S.idx%=l.length;const q=l[S.idx];
    $("app").innerHTML=`<div class="stack">${f}</div><section class="sheet"><p class="muted">${t("q",{a:S.idx+1,b:l.length})}</p>${practice(q)}
    ${S.picked!==null?`<button class="btn" id="nx">${t("next")}</button>`:""}</section>`;
    bindOpts(i=>answer(q,i));
    if($("nx"))$("nx").onclick=()=>{S.idx++;S.picked=null;render()};
  }
  $("fl").onchange=e=>{S.filter=e.target.value;S.idx=0;S.picked=null;render()};
}
function startExam(){
  clearInterval(S.tick);
  S.exam={qs:pickExam(),ans:Array(33).fill(null),i:0,end:Date.now()+36e5,over:false};
  S.view="exam";render();
  S.tick=setInterval(()=>{const e=S.exam;if(!e||e.over)return;if(Date.now()>=e.end){finish();return}const el=$("tm");if(el)el.textContent=clock()},1000);
}
function clock(){const s=Math.max(0,Math.ceil((S.exam.end-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function finish(){clearInterval(S.tick);const e=S.exam;e.over=true;e.i=0;e.qs.forEach((q,i)=>{if(e.ans[i]!==null)S.res[q.id]=e.ans[i]===q.c});save("res",S.res);render()}
function strip(e){return `<div class="strip" dir="ltr">${e.qs.map((q,i)=>{let c=i===e.i?"now ":"";c+=e.over?(e.ans[i]===q.c?"r-ok":"r-no"):(e.ans[i]!==null?"done":"");return `<button class="${c}" data-j="${i}" aria-label="${i+1}">${i+1}</button>`}).join("")}</div>`}
function vExam(){
  const e=S.exam;
  if(!e){$("app").innerHTML=`<section class="sheet"><h2>${t("exam")}</h2><p>${t("examInfo")}</p><button class="btn" id="go">${t("startExam")}</button></section>`;$("go").onclick=startExam;return}
  const q=e.qs[e.i],a=e.ans[e.i];
  if(e.over){
    const n=scoreOf(e),pass=n>=17;
    $("app").innerHTML=`<section class="sheet"><p class="chip" style="justify-self:start;background:${pass?"var(--good-bg)":"var(--bad-bg)"};color:${pass?"var(--good)":"var(--bad)"}">${pass?t("passed"):t("failed")}</p>
      <p class="big" dir="ltr" style="text-align:start">${n} / 33</p><p>${t("score",{n})}</p><button class="btn" id="go">${t("again")}</button></section>
      <p class="muted">${t("review")}</p>${strip(e)}
      <section class="sheet"><p class="muted">${t("q",{a:e.i+1,b:33})}</p>${qHead(q)}<ul class="opts">${q.o.map((_,i)=>optHtml(q,i,i===q.c?"ok":i===a?"no":"","disabled")).join("")}</ul>${a===null?`<p class="muted">${t("empty")}</p>`:""}${exp(q)?`<p class="note">${esc(exp(q))}</p>`:""}</section>`;
    $("go").onclick=startExam;
  }else{
    const left=e.ans.filter(x=>x===null).length;
    $("app").innerHTML=`<div class="row"><span class="muted">${t("q",{a:e.i+1,b:33})}</span><span class="timer" id="tm" dir="ltr">${clock()}</span></div>${strip(e)}
      <section class="sheet">${qHead(q)}<ul class="opts">${q.o.map((_,i)=>optHtml(q,i,a===i?"sel":"","")).join("")}</ul></section>
      <div class="row"><button class="btn ghost" id="pv" ${e.i?"":"disabled"}>${t("prev")}</button><button class="btn ghost" id="nq" ${e.i<32?"":"disabled"}>${t("nextQ")}</button></div>
      <button class="btn" id="fn">${t("finish")}</button><p class="muted">${left?t("left",{n:left}):""}</p>`;
    bindOpts(i=>{e.ans[e.i]=i;if(e.i<32)e.i++;render()});
    $("pv").onclick=()=>{e.i--;render()};$("nq").onclick=()=>{e.i++;render()};$("fn").onclick=finish;
  }
  document.querySelectorAll(".strip button").forEach(b=>b.onclick=()=>{e.i=+b.dataset.j;render()});
}
function render(){
  const r=document.documentElement;r.lang=S.lang;r.dir=S.lang==="ar"?"rtl":"ltr";
  $("langs").innerHTML=LANGS.map(([k,n])=>`<button data-l="${k}" lang="${k}" aria-pressed="${k===S.lang}">${n}</button>`).join("");
  document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save("lang",S.lang);render()});
  $("nav").innerHTML=["home","study","exam"].map(v=>`<button data-v="${v}" ${v===S.view?'aria-current="page"':""}>${t(v)}</button>`).join("");
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.picked=null;render()});
  ({home:vHome,study:vStudy,exam:vExam})[S.view]();
  $("foot").innerHTML=`<p>${t("proto")}</p><p>${t("dis")}</p><p><a href="${SRC}" target="_blank" rel="noopener">${t("src")}</a> · ${t("ver",{d:"07.05.2025"})}</p><p>${t("sup",{m:SUPPORT})}</p>`;
}
render();
</script>
