Resim 4"],"g":["Arma, altın sarısı zemin üzerinde siyah bir kartal gösterir; kartalın başı sola dönüktür, kanatları açık ama tüyleri kapalıdır. Gaga, dil ve pençeler kırmızıdır.","Arma, birbirini çaprazlayan Yunan harfleri P ve X'ten oluşur.","Arma, beyaz ve mavi çerçeveli gri bir haç gösterir.","Arma, içinde kırmızı zemin üzerinde altın renkli bir çekiç ile pergelin bulunduğu altın bir başak çelenginden oluşur. Çelengin alt kısmına siyah-kırmızı-altın bir kurdele dolanmıştır."],"x":"Altın sarısı zemindeki siyah kartal Federal Kartal'dır, yani Federal Cumhuriyet'in armasıdır. Diğerleri Almanya'nın devlet armaları değildir."},"ar":{"q":"أيٌّ مما يلي هو شعار جمهورية ألمانيا الاتحادية؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار نسرًا أسود على خلفية صفراء ذهبية، رأسه مائل إلى اليسار وجناحاه مفتوحان لكن ريشه مضموم. المنقار واللسان والمخالب حمراء.","يتكوّن الشعار من الحرفين اليونانيين P وX المتقاطعين.","يُظهر الشعار صليبًا رماديًا له إطار أبيض وإطار أزرق.","يتكوّن الشعار من إكليل ذهبي من سنابل القمح، وداخله مطرقة وفرجار ذهبيان على خلفية حمراء. ويلتف شريط أسود وأحمر وذهبي حول الجزء السفلي من الإكليل."],"x":"النسر الأسود على خلفية صفراء ذهبية هو نسر الاتحاد، شعار جمهورية ألمانيا الاتحادية. أما البقية فليست شعارات للدولة الألمانية."},"de":{"g":["Das Wappen zeigt auf goldgelbem Grund einen schwarzen Adler, den Kopf zur linken Seite gewendet, die Flügel offen, aber mit geschlossenem Gefieder. Schnabel, Zunge und Krallen sind in roter Farbe gehalten.","Das Wappen besteht aus den sich kreuzenden griechischen Buchstaben P und X.","Das Wappen zeigt ein graues Kreuz mit einem weißen und einem blauen Rahmen.","Das Wappen besteht aus einem goldenen Ährenkranz, in dem sich auf roten Hintergrund ein Hammer und ein Zirkel in goldener Farbe befinden. Der Ährenkranz ist im unteren Teil mit einem schwarz-rot-goldenen Band umschlungen."],"x":"Der schwarze Adler auf goldgelbem Grund ist der Bundesadler, das Wappen der Bundesrepublik. Die anderen sind keine deutschen Staatswappen."}},"55":{"en":{"q":"What does this picture show?","o":["the Bundestag building in Berlin","the Federal Constitutional Court in Karlsruhe","the Bundesrat building in Berlin","the Federal Chancellery in Berlin"],"g":["Shown is a large, cuboid building. The facade combines elements of Renaissance, Baroque and Neoclassicism. The building has numerous windows, and on the left and right are small towers on which a black-red-gold flag flies. In the middle is the entrance with many columns, toward which stairs lead. On the roof, in the middle, is the building's landmark: a large glass dome."],"x":"The large glass dome on the roof is the landmark of the Reichstag building, where the German Bundestag sits in Berlin."},"tr":{"q":"Bu resim neyi gösteriyor?","o":["Berlin'deki Federal Meclis binasını","Karlsruhe'deki Federal Anayasa Mahkemesi'ni","Berlin'deki Federal Konsey binasını","Berlin'deki Federal Başbakanlık binasını"],"g":["Resimde büyük, dikdörtgen prizma biçimli bir bina görülüyor. Cephesi Rönesans, Barok ve Neoklasisizm öğelerini bir araya getirir. Binada çok sayıda pencere vardır; sağda ve solda, üzerinde siyah-kırmızı-altın bir bayrağın dalgalandığı küçük kuleler bulunur. Ortada, merdivenlerin çıktığı, sütunlu bir giriş yer alır. Çatının tam ortasında binanın simgesi durur: büyük bir cam kubbe."],"x":"Çatıdaki büyük cam kubbe, Alman Federal Meclisi'nin Berlin'deki yeri olan Reichstag binasının simgesidir."},"ar":{"q":"ماذا تُظهر هذه الصورة؟","o":["مبنى البوندستاغ في برلين","المحكمة الدستورية الاتحادية في كارلسروه","مبنى البوندسرات في برلين","مستشارية الاتحاد في برلين"],"g":["تُظهر الصورة مبنى كبيرًا على شكل متوازي مستطيلات. تجمع واجهته بين عناصر من عصر النهضة والباروك والكلاسيكية الجديدة. للمبنى نوافذ كثيرة، وعلى يمينه ويساره أبراج صغيرة يرفرف فوقها علم أسود وأحمر وذهبي. وفي الوسط المدخل ذو الأعمدة الكثيرة تؤدي إليه درجات. وفي منتصف السطح معلم المبنى المميز: قبة زجاجية كبيرة."],"x":"القبة الزجاجية الكبيرة على السطح هي معلم مبنى الرايخستاغ في برلين، مقر البوندستاغ الألماني."},"de":{"g":["Abgebildet ist ein großes, quaderförmiges Gebäude. Die Fassade kombiniert Elemente aus Renaissance, Barock und Klassizismus. Das Gebäude hat zahlreiche Fenster, links und rechts kleine Türme, auf denen eine schwarz-rot-goldene Flagge weht. In der Mitte befindet sich der säulenreiche Eingang, auf den Treppen zulaufen. Auf dem Dach befindet sich mittig das Wahrzeichen des Gebäudes: eine große Glaskuppel."],"x":"Die große Glaskuppel auf dem Dach ist das Wahrzeichen des Reichstagsgebäudes in Berlin, dem Sitz des Deutschen Bundestages."}},"70":{"en":{"q":"In 1974, German Federal President Gustav Heinemann hands Helmut Schmidt the certificate of appointment as German Federal Chancellor. What is one of the duties of the German Federal President?","o":["She/He runs the day-to-day business of government.","She/He supervises the governing party.","She/He selects the ministers.","She/He proposes the Federal Chancellor for election."],"g":["A photo from 1974 shows the following situation: the then German Federal President Gustav Heinemann hands Helmut Schmidt the certificate of appointment as German Federal Chancellor."],"x":"The Federal President proposes the Federal Chancellor to the Bundestag for election. The government is run by the Federal Chancellor, who also chooses the ministers."},"tr":{"q":"1974'te dönemin Alman Federal Cumhurbaşkanı Gustav Heinemann, Helmut Schmidt'e Alman Federal Başbakanı olarak atanma belgesini veriyor. Alman Federal Cumhurbaşkanı'nın görevleri arasında hangisi vardır?","o":["Hükûmet işlerini yürütür.","İktidar partisini denetler.","Bakanları seçer.","Federal Başbakan'ı seçim için önerir."],"g":["1974 tarihli bir fotoğraf şu durumu gösteriyor: Dönemin Alman Federal Cumhurbaşkanı Gustav Heinemann, Helmut Schmidt'e Alman Federal Başbakanı olarak atanma belgesini veriyor."],"x":"Federal Cumhurbaşkanı, Federal Başbakan'ı seçilmek üzere Federal Meclis'e önerir. Hükûmeti Federal Başbakan yönetir ve bakanları da o seçer."},"ar":{"q":"في عام 1974 يسلّم الرئيس الاتحادي الألماني غوستاف هاينمان هلموت شميت وثيقة تعيينه مستشارًا اتحاديًا لألمانيا. ما الذي يدخل ضمن مهام الرئيس الاتحادي الألماني؟","o":["يتولى تسيير شؤون الحكومة.","يراقب الحزب الحاكم.","يختار الوزراء.","يقترح المستشار للانتخاب."],"g":["تُظهر صورة تعود إلى عام 1974 الموقف التالي: الرئيس الاتحادي الألماني آنذاك غوستاف هاينمان يسلّم هلموت شميت وثيقة تعيينه مستشارًا اتحاديًا لألمانيا."],"x":"يقترح الرئيس الاتحادي المستشار على البوندستاغ لانتخابه. أما المستشار فيدير الحكومة ويختار الوزراء."},"de":{"g":["Ein Foto aus dem Jahr 1974 zeigt folgende Situation: Der damalige deutsche Bundespräsident Gustav Heinemann gibt Helmut Schmidt die Ernennungsurkunde zum deutschen Bundeskanzler."],"x":"Die Bundespräsidentin/der Bundespräsident schlägt dem Bundestag die Kanzlerin/den Kanzler zur Wahl vor. Die Regierung führt die Kanzlerin/der Kanzler."}},"130":{"en":{"q":"Which ballot paper would be valid in a Bundestag election?","o":["1","2","3","4"],"g":["1. The ballot paper allows two votes: a first vote and a second vote. One vote was marked as the first vote, and the other was marked as the second vote.\n2. The ballot paper allows two votes: a first vote and a second vote. Two votes were marked as the second vote.\n3. The ballot paper allows two votes: a first vote and a second vote. Two votes were marked as the first vote.\n4. The ballot paper allows two votes: a first vote and a second vote. Three votes were marked as the first vote."],"x":"Each voter has exactly one first vote and one second vote. Only ballot 1 marks one of each, so it is valid."},"tr":{"q":"Federal Meclis seçiminde hangi oy pusulası geçerli olurdu?","o":["1","2","3","4"],"g":["1. Oy pusulasında iki oy kullanılabilir: bir birinci oy ve bir ikinci oy. Bir oy birinci oy olarak, diğer oy ikinci oy olarak işaretlenmiştir.\n2. Oy pusulasında iki oy kullanılabilir: bir birinci oy ve bir ikinci oy. İki oy da ikinci oy olarak işaretlenmiştir.\n3. Oy pusulasında iki oy kullanılabilir: bir birinci oy ve bir ikinci oy. İki oy da birinci oy olarak işaretlenmiştir.\n4. Oy pusulasında iki oy kullanılabilir: bir birinci oy ve bir ikinci oy. Üç oy birinci oy olarak işaretlenmiştir."],"x":"Her seçmenin tam bir birinci ve bir ikinci oyu vardır. Yalnızca 1 numaralı pusulada her ikisinden biri işaretli olduğu için geçerlidir."},"ar":{"q":"أيّ ورقة اقتراع تكون صحيحة في انتخابات البوندستاغ؟","o":["1","2","3","4"],"g":["1. يُسمح في ورقة الاقتراع بصوتين: صوت أول وصوت ثانٍ. وُضعت علامة على صوت واحد بوصفه الصوت الأول، وعلى الصوت الآخر بوصفه الصوت الثاني.\n2. يُسمح في ورقة الاقتراع بصوتين: صوت أول وصوت ثانٍ. وُضعت علامة على صوتين بوصفهما صوتًا ثانيًا.\n3. يُسمح في ورقة الاقتراع بصوتين: صوت أول وصوت ثانٍ. وُضعت علامة على صوتين بوصفهما صوتًا أول.\n4. يُسمح في ورقة الاقتراع بصوتين: صوت أول وصوت ثانٍ. وُضعت علامة على ثلاثة أصوات بوصفها صوتًا أول."],"x":"لكل ناخب صوت أول واحد وصوت ثانٍ واحد فقط. الورقة 1 وحدها تحمل علامة على كل منهما، لذلك هي الصحيحة."},"de":{"g":["1. Auf dem Stimmzettel dürfen zwei Stimmen abgegeben werden: eine Erststimme und eine Zweitstimme. Eine Stimme wurde als Erststimme angekreuzt, die zweite Stimme wurde als Zweitstimme angekreuzt.\n2. Auf dem Stimmzettel dürfen zwei Stimmen abgegeben werden: eine Erststimme und eine Zweitstimme. Es wurden zwei Stimmen als Zweitstimme angekreuzt.\n3. Auf dem Stimmzettel dürfen zwei Stimmen abgegeben werden: eine Erststimme und eine Zweitstimme. Es wurden zwei Stimmen als Erststimme angekreuzt.\n4. Auf dem Stimmzettel dürfen zwei Stimmen abgegeben werden: eine Erststimme und eine Zweitstimme. Es wurden drei Stimmen als Erststimme angekreuzt."],"x":"Jede Wählerin/jeder Wähler hat genau eine Erst- und eine Zweitstimme. Nur Stimmzettel 1 hat je eine Markierung, daher ist er gültig."}},"176":{"en":{"q":"How were the occupation zones of Germany distributed after 1945?","o":["1=Great Britain, 2=Soviet Union, 3=France, 4=USA","1=Soviet Union, 2=Great Britain, 3=USA, 4=France","1=Great Britain, 2=Soviet Union, 3=USA, 4=France","1=Great Britain, 2=USA, 3=Soviet Union, 4=France"],"g":["1. Northwestern occupation zone: Schleswig-Holstein, Lower Saxony, North Rhine-Westphalia, Hamburg, western part of Berlin\n2. Northeastern occupation zone: Mecklenburg-Western Pomerania, Brandenburg, Saxony-Anhalt, Saxony, Thuringia, eastern part of Berlin\n3. Southeastern occupation zone: Bavaria, Hesse, northern part of Württemberg, northern part of Baden, Bremen, southwestern part of Berlin\n4. Southwestern occupation zone: Rhineland-Palatinate, Saarland, southern part of Württemberg, southern part of Baden, northwestern part of Berlin"],"x":"The northwest went to Britain, the northeast with Berlin's east to the Soviet Union, the southeast with Bavaria to the USA, the southwest to France."},"tr":{"q":"1945'ten sonra Almanya'nın işgal bölgeleri nasıl paylaştırılmıştı?","o":["1=Büyük Britanya, 2=Sovyetler Birliği, 3=Fransa, 4=ABD","1=Sovyetler Birliği, 2=Büyük Britanya, 3=ABD, 4=Fransa","1=Büyük Britanya, 2=Sovyetler Birliği, 3=ABD, 4=Fransa","1=Büyük Britanya, 2=ABD, 3=Sovyetler Birliği, 4=Fransa"],"g":["1. Kuzeybatı işgal bölgesi: Schleswig-Holstein, Aşağı Saksonya, Kuzey Ren-Vestfalya, Hamburg, Berlin'in batı kesimi\n2. Kuzeydoğu işgal bölgesi: Mecklenburg-Vorpommern, Brandenburg, Saksonya-Anhalt, Saksonya, Türingiya, Berlin'in doğu kesimi\n3. Güneydoğu işgal bölgesi: Bavyera, Hessen, Württemberg'in kuzey kısmı, Baden'in kuzey kısmı, Bremen, Berlin'in güneybatı kesimi\n4. Güneybatı işgal bölgesi: Rheinland-Pfalz, Saarland, Württemberg'in güney kısmı, Baden'in güney kısmı, Berlin'in kuzeybatı kesimi"],"x":"Kuzeybatı Britanya'ya, Berlin'in doğusuyla kuzeydoğu Sovyetler Birliği'ne, Bavyera'nın da içinde olduğu güneydoğu ABD'ye, güneybatı Fransa'ya verildi."},"ar":{"q":"كيف جرى توزيع مناطق الاحتلال في ألمانيا بعد عام 1945؟","o":["1=بريطانيا العظمى، 2=الاتحاد السوفييتي، 3=فرنسا، 4=الولايات المتحدة","1=الاتحاد السوفييتي، 2=بريطانيا العظمى، 3=الولايات المتحدة، 4=فرنسا","1=بريطانيا العظمى، 2=الاتحاد السوفييتي، 3=الولايات المتحدة، 4=فرنسا","1=بريطانيا العظمى، 2=الولايات المتحدة، 3=الاتحاد السوفييتي، 4=فرنسا"],"g":["1. منطقة الاحتلال الشمالية الغربية: شليسفيغ-هولشتاين، ساكسونيا السفلى، شمال الراين-ويستفاليا، هامبورغ، الجزء الغربي من برلين\n2. منطقة الاحتلال الشمالية الشرقية: مكلنبورغ-فوربومرن، براندنبورغ، ساكسونيا-أنهالت، ساكسونيا، تورينغن، الجزء الشرقي من برلين\n3. منطقة الاحتلال الجنوبية الشرقية: بافاريا، هيسن، الجزء الشمالي من فورتمبيرغ، الجزء الشمالي من بادن، بريمن، الجزء الجنوبي الغربي من برلين\n4. منطقة الاحتلال الجنوبية الغربية: راينلاند-بالاتينات، سارلاند، الجزء الجنوبي من فورتمبيرغ، الجزء الجنوبي من بادن، الجزء الشمالي الغربي من برلين"],"x":"ذهب الشمال الغربي إلى بريطانيا، والشمال الشرقي مع شرق برلين إلى الاتحاد السوفييتي، والجنوب الشرقي مع بافاريا إلى أمريكا، والجنوب الغربي إلى فرنسا."},"de":{"g":["1. Nordwestliche Besatzungszone: Schleswig-Holstein, Niedersachsen, Nordrhein-Westfalen, Hamburg, Westteil Berlins\n2. Nordöstliche Besatzungszone: Mecklenburg-Vorpommern, Brandenburg, Sachsen-Anhalt, Sachsen, Thüringen, Ostteil Berlins\n3. Südöstliche Besatzungszone: Bayern, Hessen, Nordteil Württembergs, Nordteil Badens, Bremen, Südwestteil Berlins\n4. Südwestliche Besatzungszone: Rheinland-Pfalz, Saarland, Südteil Württembergs, Südteil Badens, Nordwestteil Berlins"],"x":"Der Nordwesten fiel an Großbritannien, der Nordosten mit Ostberlin an die Sowjetunion, der Südosten mit Bayern an die USA, der Südwesten an Frankreich."}},"181":{"en":{"q":"What did Willy Brandt want to express with his kneeling in 1970 at the former Jewish ghetto in Warsaw?","o":["He submitted to the former Allies.","He asked Poland and the Polish Jews for forgiveness.","He showed his humility before the Warsaw Pact.","He said a prayer at the grave of the Unknown Soldier."],"g":["The picture is a photo in which the then Federal Chancellor Willy Brandt kneels down on a square in 1970. He looks shaken. His hands are folded in front of his body. Many people can be seen in the background."],"x":"Brandt knelt at the Warsaw Ghetto memorial to ask forgiveness for Nazi crimes against Poland and the Jews. It was no submission or prayer."},"tr":{"q":"Willy Brandt, 1970'te Varşova'daki eski Yahudi gettosunda diz çökerek ne anlatmak istedi?","o":["Eski Müttefiklere boyun eğdi.","Polonya'dan ve Polonyalı Yahudilerden af diledi.","Varşova Paktı karşısındaki alçakgönüllülüğünü gösterdi.","Meçhul Asker'in mezarı başında dua etti."],"g":["Resimde, dönemin Federal Başbakanı Willy Brandt'ın 1970'te bir meydanda diz çöktüğü bir fotoğraf görülüyor. Yüzünde derin bir sarsıntı var. Elleri önünde kenetlenmiş. Arka planda çok sayıda insan görülüyor."],"x":"Brandt, Varşova Gettosu anıtında Nazilerin Polonya'ya ve Yahudilere işlediği suçlar için af diledi. Bu bir boyun eğme ya da dua değildi."},"ar":{"q":"ماذا أراد ويلي برانت أن يعبّر عنه بجثوّه على ركبتيه عام 1970 في الحي اليهودي السابق في وارسو؟","o":["خضع للحلفاء السابقين.","طلب الصفح من بولندا ومن اليهود البولنديين.","أظهر تواضعه أمام حلف وارسو.","أدّى صلاة عند قبر الجندي المجهول."],"g":["الصورة فوتوغرافية يظهر فيها المستشار الاتحادي آنذاك ويلي برانت وهو يركع على ساحة عام 1970. تبدو عليه علامات التأثر. يداه مضمومتان أمام جسده. ويظهر في الخلفية أناس كثيرون."],"x":"جثا برانت على ركبتيه عند نصب حي وارسو اليهودي ليطلب الصفح عن جرائم النازيين بحق بولندا واليهود. لم يكن ذلك خضوعًا ولا صلاة."},"de":{"g":["Abgebildet ist ein Foto, auf welchem der damalige Bundeskanzler Willy Brandt 1970 auf einem Platz niederkniet. Er blickt betroffen. Seine Hände sind vor dem Körper gefaltet. Im Hintergrund sind viele Menschen zu sehen."],"x":"Brandt kniete am Denkmal des Warschauer Ghettos und bat für die NS-Verbrechen an Polen und Juden um Vergebung. Es war weder Unterwerfung noch Gebet."}},"187":{"en":{"q":"Which German state had a black-red-gold flag with a hammer, compass and wreath of ears of grain?","o":["Prussia","Federal Republic of Germany","\"Third Reich\"","GDR"],"g":["Shown is a black-red-gold flag. In the middle is a golden wreath of ears of grain, inside which a hammer and a compass in gold lie on a red background. The lower part of the wreath is wrapped in a black-red-gold ribbon."],"x":"The hammer, compass and wreath of ears of grain were the emblem of the German Democratic Republic (GDR) on its flag."},"tr":{"q":"Hangi Alman devletinin bayrağı siyah-kırmızı-altın renkliydi ve üzerinde çekiç, pergel ve başak çelengi vardı?","o":["Prusya (Preußen)","Almanya Federal Cumhuriyeti (Bundesrepublik Deutschland)","\"Üçüncü Reich\" (Drittes Reich)","Doğu Almanya (DDR)"],"g":["Resimde siyah-kırmızı-altın renkli bir bayrak görülüyor. Ortada, içinde kırmızı zemin üzerinde altın renkli bir çekiç ile pergelin bulunduğu altın bir başak çelengi vardır. Çelengin alt kısmına siyah-kırmızı-altın bir kurdele dolanmıştır."],"x":"Çekiç, pergel ve başak çelengi, Alman Demokratik Cumhuriyeti'nin (DDR, Doğu Almanya) bayrağındaki amblemdi."},"ar":{"q":"أيّ دولة ألمانية كان لها علم أسود وأحمر وذهبي عليه مطرقة وفرجار وإكليل من السنابل؟","o":["بروسيا","جمهورية ألمانيا الاتحادية","«الرايخ الثالث»","جمهورية ألمانيا الديمقراطية"],"g":["تظهر في الصورة راية سوداء وحمراء وذهبية. وفي وسطها إكليل ذهبي من سنابل القمح، وداخله مطرقة وفرجار ذهبيان على خلفية حمراء. ويلتف شريط أسود وأحمر وذهبي حول الجزء السفلي من الإكليل."],"x":"كانت المطرقة والفرجار وإكليل السنابل شعار جمهورية ألمانيا الديمقراطية (ألمانيا الشرقية) على علمها."},"de":{"g":["Abgebildet ist eine schwarz-rot-goldene Flagge. In der Mitte ist ein goldener Ährenkranz, in dem sich auf roten Hintergrund ein Hammer und ein Zirkel in goldener Farbe befinden. Der Ährenkranz ist im unteren Teil mit einem schwarz-rot-goldenen Band umschlungen."],"x":"Hammer, Zirkel und Ährenkranz waren das Emblem in der Flagge der Deutschen Demokratischen Republik (DDR)."}},"209":{"en":{"q":"Which was the coat of arms of the German Democratic Republic?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows a black eagle on a golden-yellow ground. Its head is turned to the left, its wings are spread but the plumage is closed. Beak, tongue and claws are coloured red.","The coat of arms is made up of the crossing Greek letters P and X.","The coat of arms shows a grey cross with a white and a blue frame.","The coat of arms consists of a golden wreath of ears of grain in which a golden hammer and a golden compass lie on a red background. The lower part of the wreath is wound with a black-red-gold ribbon."],"x":"The East German arms showed a hammer and compass inside a wreath of ears of grain. The others are the Federal Eagle and unrelated symbols."},"tr":{"q":"Alman Demokratik Cumhuriyeti'nin arması hangisiydi?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, altın sarısı zemin üzerinde siyah bir kartal gösterir. Kartalın başı sola dönüktür, kanatları açık, tüyleri ise kapalıdır. Gaga, dil ve pençeler kırmızı renktedir.","Arma, birbiriyle kesişen Yunan harfleri P ve X'ten meydana gelir.","Arma, beyaz ve mavi bir çerçeveye sahip gri bir haç gösterir.","Arma, kırmızı zemin üzerinde altın bir çekiç ve altın bir pergelin yer aldığı altın bir başak çelengidir. Çelengin alt kısmı siyah-kırmızı-altın bir kurdeleyle sarılmıştır."],"x":"Doğu Almanya'nın armasında başak çelengi içinde çekiç ve pergel vardı. Diğerleri Federal Kartal ve ilgisiz iki simgedir."},"ar":{"q":"أيٌّ كان شعار جمهورية ألمانيا الديمقراطية؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار نسرًا أسود على أرضية صفراء ذهبية. رأسه متجه إلى اليسار، وجناحاه منشوران وريشه مضموم. المنقار واللسان والمخالب بلون أحمر.","يتألف الشعار من الحرفين اليونانيين P وX المتقاطعين.","يُظهر الشعار صليبًا رماديًا بإطار أبيض وآخر أزرق.","يتألف الشعار من إكليل ذهبي من السنابل، وفيه مطرقة وفرجار بلون ذهبي على خلفية حمراء. ويلفّ شريط أسود وأحمر وذهبي الجزء السفلي من الإكليل."],"x":"كان شعار ألمانيا الشرقية يضم مطرقة وفرجارًا داخل إكليل من السنابل. أما البقية فهي نسر الاتحاد ورمزان لا علاقة لهما بذلك."},"de":{"g":["Das Wappen zeigt auf goldgelbem Grund einen schwarzen Adler, den Kopf zur linken Seite gewendet, die Flügel offen, aber mit geschlossenem Gefieder. Schnabel, Zunge und Krallen sind in roter Farbe gehalten.","Das Wappen besteht aus den sich kreuzenden griechischen Buchstaben P und X.","Das Wappen zeigt ein graues Kreuz mit einem weißen und einem blauen Rahmen.","Das Wappen besteht aus einem goldenen Ährenkranz, in dem sich auf roten Hintergrund ein Hammer und ein Zirkel in goldener Farbe befinden. Der Ährenkranz ist im unteren Teil mit einem schwarz-rot-goldenen Band umschlungen."],"x":"Das DDR-Wappen zeigte Hammer und Zirkel im Ährenkranz. Die anderen sind der Bundesadler und zwei fremde Symbole."}},"216":{"en":{"q":"Which symbol can be seen in the plenary chamber of the German Bundestag?","o":["the Federal Eagle","the flag of the city of Berlin","the Imperial Eagle","the Imperial Crown"],"g":["Shown is a photo of the plenary chamber of the German Bundestag. Blue seats are arranged in a semicircle. On a higher level, rows of black benches are likewise arranged in a semicircle. In front of the blue seats, at the centre of the semicircle, is the speaker's lectern, along with further blue seats. At the front of the semicircle the room is decorated by a glass facade, four tall columns, a large version of a coat of arms with an eagle, and two flags: on the left a black-red-gold flag, on the right a blue flag with stars. On the left and right sides of the room are large windows. Many people are in the plenary chamber: members of parliament, visitors, photographers."],"x":"A large black eagle, the Federal Eagle, hangs on the front wall. The Imperial Eagle (used until 1945) and Crown stand for earlier German states, not the Federal Republic."},"tr":{"q":"Alman Federal Meclisi'nin genel kurul salonunda hangi simge görülür?","o":["Federal Kartal","Berlin şehrinin bayrağı","İmparatorluk Kartalı","İmparatorluk tacı"],"g":["Resimde Alman Federal Meclisi'nin genel kurul salonunun bir fotoğrafı görülüyor. Mavi koltuklar yarım daire biçiminde sıralanmıştır. Daha yüksek bir seviyede, siyah sıralar da yarım daire biçiminde dizilmiştir. Mavi koltukların önünde, yarım dairenin merkezinde konuşma kürsüsü ve ayrıca başka mavi koltuklar vardır. Yarım dairenin ön tarafında salon; bir cam cephe, dört yüksek sütun, iri bir kartal arması ve iki bayrakla süslenmiştir: solda siyah-kırmızı-altın bir bayrak, sağda yıldızlı mavi bir bayrak. Salonun sol ve sağ yanlarında büyük pencereler bulunur. Genel kurul salonunda çok sayıda kişi vardır: milletvekilleri, ziyaretçiler, fotoğrafçılar."],"x":"Genel kurul salonunun ön duvarında büyük siyah bir kartal, yani Federal Kartal asılıdır. İmparatorluk Kartalı (1945'e kadar kullanıldı) ve İmparatorluk Tacı önceki Alman devletlerini simgeler, Federal Cumhuriyet'i değil."},"ar":{"q":"أيّ رمز يمكن رؤيته في قاعة الجلسات العامة للبوندستاغ الألماني؟","o":["نسر الاتحاد","علم مدينة برلين","نسر الرايخ","تاج الرايخ"],"g":["تظهر في الصورة قاعة الجلسات العامة للبوندستاغ الألماني. المقاعد الزرقاء مرتبة على شكل نصف دائرة. وعلى مستوى أعلى صفوف من المقاعد السوداء مرتبة هي الأخرى على شكل نصف دائرة. أمام المقاعد الزرقاء، في مركز نصف الدائرة، منصة الخطابة، إضافة إلى مقاعد زرقاء أخرى. وفي واجهة نصف الدائرة تزيّن القاعة واجهة زجاجية وأربعة أعمدة عالية وشعار كبير على شكل نسر وعلمان: على اليسار علم أسود وأحمر وذهبي، وعلى اليمين علم أزرق عليه نجوم. وعلى جانبي القاعة الأيسر والأيمن نوافذ كبيرة. وفي القاعة أناس كثيرون: نواب وزوار ومصورون."],"x":"يعلو الجدار الأمامي للقاعة نسر أسود كبير هو نسر الاتحاد. أما نسر الرايخ (الذي استُخدم حتى 1945) وتاج الرايخ فهما من رموز دول ألمانية سابقة، لا من رموز الجمهورية الاتحادية."},"de":{"g":["Abgebildet ist ein Foto des Plenarsaals des Deutschen Bundestages. Im Halbkreis sind blaue Sitze angeordnet. Auf einer höheren Ebene sind ebenfalls im Halbkreis schwarze Bankreihen angeordnet. Vor den blauen Sitzen ist im Zentrum des Halb-kreises das Rednerpult zu sehen, zudem weitere blaue Sitze. An der Frontseite des Halbkreises wird der Raum verziert durch eine Glasfassade, vier hohe Säulen, das Wappen eines Adlers in großer Ausführung sowie zwei Flaggen: links eine schwarz-rot-goldene Flagge, rechts eine blaue Flagge mit Sternen. An der linken und rechten Seite des Raumes sind große Fenster. Im Plenarsaal befinden sich viele Menschen: Abgeordnete, Besucher, Fotografen."],"x":"An der Stirnwand des Plenarsaals hängt der große schwarze Bundesadler. Reichsadler (bis 1945) und Reichskrone stehen für frühere Reiche, nicht für die Bundesrepublik."}},"226":{"en":{"q":"Which is the flag of the European Union?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The flag consists of seven red and six white stripes. In the upper left corner is a blue rectangle with 50 white stars.","The flag has a dark blue background with a circle of twelve golden stars in the middle.","The flag has a sky-blue background. In the middle is a white world map centred on the North Pole, framed by a white wreath of olive branches.","The flag has a blue background. In the middle is a yellow symbol. It consists of a large letter C surrounded by several dots, small squares and lines of different lengths. Inside the large letter C is another, smaller letter C."],"x":"The EU flag shows a circle of twelve golden stars on dark blue. The others are the US flag, the UN flag and another emblem."},"tr":{"q":"Avrupa Birliği'nin bayrağı hangisidir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Bayrak yedi kırmızı ve altı beyaz şeritten oluşur. Sol üst köşede 50 beyaz yıldızlı mavi bir dikdörtgen bulunur.","Bayrağın zemini koyu mavidir; ortasında on iki altın yıldızdan oluşan bir daire vardır.","Bayrağın zemini gök mavisidir. Ortada, Kuzey Kutbu merkez alınarak çizilmiş beyaz bir dünya haritası bulunur; harita, zeytin dallarından oluşan beyaz bir çelenkle çevrilidir.","Bayrağın zemini mavidir. Ortada sarı bir simge vardır. Bu simge, çevresinde birkaç nokta, küçük kare ve farklı uzunlukta çizgi bulunan büyük bir C harfinden oluşur. Bu büyük C harfinin içinde bir küçük C harfi daha vardır."],"x":"AB bayrağında koyu mavi zemin üzerinde daire biçiminde on iki altın yıldız vardır. Diğerleri ABD bayrağı, BM bayrağı ve başka bir kuruluşun amblemidir."},"ar":{"q":"أيٌّ مما يلي هو علم الاتحاد الأوروبي؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن العلم من سبعة خطوط حمراء وستة خطوط بيضاء. وفي الزاوية العليا اليسرى مستطيل أزرق فيه 50 نجمة بيضاء.","خلفية العلم زرقاء داكنة، وفي وسطها دائرة من اثنتي عشرة نجمة ذهبية.","خلفية العلم زرقاء سماوية. وفي الوسط خريطة بيضاء للعالم مركزها القطب الشمالي، يحيط بها إكليل أبيض من أغصان الزيتون.","خلفية العلم زرقاء. وفي الوسط رمز أصفر يتكوّن من حرف C كبير تحيط به عدة نقاط ومربعات صغيرة وخطوط مختلفة الأطوال. وداخل هذا الحرف الكبير حرف C آخر أصغر."],"x":"يحمل علم الاتحاد الأوروبي دائرة من اثنتي عشرة نجمة ذهبية على خلفية زرقاء داكنة. أما البقية فعلم أمريكا وعلم الأمم المتحدة وشعار منظمة أخرى."},"de":{"g":["Die Flagge besteht aus sieben roten und sechs weißen Streifen. In der oberen linken Ecke befindet sich ein blaues Rechteck mit 50 weißen Sternen.","Die Flagge hat einen dunkelblauen Hintergrund, auf dem in der Mitte ein Kreis aus zwölf goldenen Sternen abgebildet ist.","Die Flagge hat einen himmelblauen Hintergrund. In der Mitte ist eine weiße Weltkarte mit dem Nordpol als Mittelpunkt abgebildet, welche von einem weißen Kranz aus Zweigen eines Olivenbaums umrahmt wird.","Die Flagge hat einen blauen Hintergrund. In der Mitte ist ein gelbes Symbol abgebildet. Es besteht aus einem großen Buchstaben C, der von mehreren Punkten, kleinen Quadraten und unterschiedlich langen Strichen umgeben ist. In diesem großen Buchstaben C befindet sich ein weiterer kleiner Buchstaben C."],"x":"Die EU-Flagge zeigt einen Kreis aus zwölf goldenen Sternen auf dunkelblauem Grund. Die anderen sind US-Flagge, UN-Flagge und ein anderes Emblem."}},"235":{"en":{"q":"The then French President François Mitterrand and the then German Federal Chancellor Helmut Kohl jointly commemorate the dead of both world wars in Verdun. Which goal of the European Union becomes clear at this meeting?","o":["Friendship between England and Germany","Freedom to travel to all EU countries","Peace and security in the EU countries","Uniform public holidays in the EU countries"],"g":["The photo shows the then French President François Mitterrand and the then German Federal Chancellor Helmut Kohl. They are holding hands and look shaken. In front of them are two funeral wreaths and a coffin covered with a black-red-gold flag and a blue-white-red flag. In the background many people are gathered, who likewise look on reverently."],"x":"Two former enemies mourning together show that the EU's aim is lasting peace and security among its member states."},"tr":{"q":"Dönemin Fransa Cumhurbaşkanı François Mitterrand ile dönemin Alman Federal Başbakanı Helmut Kohl, Verdun'de her iki dünya savaşında ölenleri birlikte anıyor. Bu görüşmede Avrupa Birliği'nin hangi hedefi açıkça görülüyor?","o":["İngiltere ile Almanya arasında dostluk","AB'nin tüm ülkelerine seyahat özgürlüğü","AB ülkelerinde barış ve güvenlik","AB ülkelerinde ortak resmî tatiller"],"g":["Fotoğrafta dönemin Fransa Cumhurbaşkanı François Mitterrand ile dönemin Alman Federal Başbakanı Helmut Kohl görülüyor. İkisi el ele tutuşmuş, sarsılmış bir ifadeyle bakıyorlar. Önlerinde iki cenaze çelengi ile siyah-kırmızı-altın bir bayrakla ve mavi-beyaz-kırmızı bir bayrakla örtülü bir tabut duruyor. Arka planda çok sayıda insan toplanmış; onlar da saygıyla bakıyor."],"x":"Eski iki düşmanın birlikte yas tutması, AB'nin hedefinin üye ülkeler arasında kalıcı barış ve güvenlik olduğunu gösterir."},"ar":{"q":"يحيي الرئيس الفرنسي آنذاك فرانسوا ميتران والمستشار الاتحادي الألماني آنذاك هلموت كول معًا ذكرى قتلى الحربين العالميتين في فردان. أيّ هدف من أهداف الاتحاد الأوروبي يتضح في هذا اللقاء؟","o":["الصداقة بين إنجلترا وألمانيا","حرية السفر إلى جميع دول الاتحاد الأوروبي","السلام والأمن في دول الاتحاد الأوروبي","عطلات رسمية موحدة في دول الاتحاد الأوروبي"],"g":["تُظهر الصورة الرئيس الفرنسي آنذاك فرانسوا ميتران والمستشار الاتحادي الألماني آنذاك هلموت كول. يمسك كل منهما بيد الآخر وتبدو عليهما علامات التأثر. أمامهما إكليلان جنائزيان وتابوت مغطى بعلم أسود وأحمر وذهبي وعلم أزرق وأبيض وأحمر. وفي الخلفية يقف أناس كثيرون ينظرون بخشوع هم أيضًا."],"x":"وقوف عدوّين سابقين معًا في الحداد يبيّن أن هدف الاتحاد الأوروبي هو سلام وأمن دائمان بين دوله."},"de":{"g":["Das Foto zeigt den damaligen französischen Staatspräsidenten François Mitterrand und den damaligen deutschen Bundeskanzler Helmut Kohl. Beide halten sich an der Hand, blicken betroffen. Vor ihnen stehen zwei Trauerkränze sowie ein Sarg, der mit einer schwarz-rot-goldenen Flagge und einer blau-weiß-roten Flagge bedeckt ist. Im Hintergrund sind viele Menschen versammelt, die ebenso andächtig blicken."],"x":"Zwei frühere Gegner trauern gemeinsam. Das zeigt das EU-Ziel: dauerhaft Frieden und Sicherheit zwischen den Mitgliedstaaten."}},"baden-wuerttemberg-1":{"en":{"q":"Which coat of arms belongs to the state of Baden-Württemberg?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows three black lions walking to the left, with red tongues. The background of the coat of arms is gold. A golden crown rests on top of it.","The coat of arms consists of an upright lion facing left, striped red and silver eight times. It has golden claws and a golden crown. The lion is surrounded by eight white stars. The background is blue.","The coat of arms is divided in two. The upper field is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left. In the upper right corner is a white field with a black eagle looking to the left. The talons and beak are yellow, the tongue is red. The lower field is white and shows a black bear walking to the left on a red crenellated wall with black joints and an open gate.","The coat of arms shows a white castle with three towers on a red background. The gate is closed. The middle tower has a dome and is taller than the two outer towers. A cross stands on top of the middle tower. A white star hovers above each of the two outer towers."],"x":"Baden-Württemberg's state arms show three walking black lions on a gold ground, crowned. The other pictures are other states' arms."},"tr":{"q":"Baden-Württemberg eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, kırmızı dilli, sola doğru yürüyen üç siyah aslan gösterir. Armanın zemini altın rengindedir. Armanın üstünde altın bir taç durur.","Arma, sola dönük, dik duran, sekiz kez kırmızı ve gümüş renkte şeritli bir aslandan oluşur. Aslanın altın pençeleri ve altın bir tacı vardır. Aslanı sekiz beyaz yıldız çevreler. Zemin mavidir.","Arma ikiye bölünmüştür. Üst alan beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi (Rautenkranz) yer alır. Sağ üst köşede, sola bakan siyah bir kartalın bulunduğu beyaz bir alan vardır. Kartalın pençeleri ve gagası sarı, dili kırmızıdır. Alt alan beyazdır ve kırmızı, siyah derzli, kapısı açık, mazgallı bir surun üzerinde sola doğru yürüyen siyah bir ayı gösterir.","Arma, kırmızı zemin üzerinde üç kuleli beyaz bir kale gösterir. Kapı kapalıdır. Ortadaki kulenin bir kubbesi vardır ve yandaki iki kuleden daha yüksektir. Ortadaki kulenin tepesinde bir haç bulunur. Yandaki iki kulenin üzerinde de birer beyaz yıldız asılı durur."],"x":"Baden-Württemberg armasında altın zemin üzerinde, tacın altında yürüyen üç siyah aslan bulunur. Diğer resimler başka eyaletlerin armalarıdır."},"ar":{"q":"أيُّ شعار يخصّ ولاية بادن-فورتمبيرغ؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار ثلاثة أسود سوداء تمشي نحو اليسار بألسنة حمراء. خلفية الشعار ذهبية، ويعلوه تاج ذهبي.","يتكوّن الشعار من أسد منتصب متجه إلى اليسار، مخطّط ثماني مرات بالأحمر والفضي. له مخالب ذهبية وتاج ذهبي، وتحيط به ثماني نجوم بيضاء. الخلفية زرقاء.","الشعار مقسوم إلى قسمين. الحقل العلوي مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب (Rautenkranz) يمتد من الأسفل يمينًا إلى الأعلى يسارًا. وفي الزاوية العليا اليمنى حقل أبيض فيه نسر أسود ينظر إلى اليسار، مخالبه ومنقاره صفراء ولسانه أحمر. والحقل السفلي أبيض ويُظهر دبًا أسود يمشي نحو اليسار فوق سور أحمر مسنّن ذي فواصل سوداء وبوابة مفتوحة.","يُظهر الشعار قلعة بيضاء بثلاثة أبراج على خلفية حمراء. البوابة مغلقة. للبرج الأوسط قبة وهو أعلى من البرجين الخارجيين. وفي أعلى البرج الأوسط صليب. وفوق كل من البرجين الخارجيين تحوم نجمة بيضاء."],"x":"يحمل شعار بادن-فورتمبيرغ ثلاثة أسود سوداء ماشية على أرضية ذهبية وتحتها تاج. أما الصور الأخرى فلولايات أخرى."},"de":{"g":["Das Wappen zeigt drei nach links schreitende schwarze Löwen mit roten Zungen. Der Hintergrund des Wappens ist gold. Oben auf dem Wappen ruht eine goldene Krone.","Das Wappen besteht aus einem nach links gewandten aufrechtstehenden Löwen, der achtfach rot und silbern gestreift ist. Er hat goldene Krallen und eine goldene Krone. Der Löwe wird von acht weißen Sternen umgeben. Der Hintergrund ist blau.","Das Wappen ist zweigeteilt. Das obere Feld ist jeweils fünf-fach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz. In der oberen rechten Ecke befindet sich ein weißes Feld mit einem schwarzen zur linken Seite blickenden Adler. Die Fänge und der Schnabel sind gelb, die Zunge rot. Das untere Feld ist weiß und zeigt einen nach links schreitenden schwarzen Bären auf einer schwarzgefugten, roten Zinnenmauer mit offenem Tor.","Das Wappen zeigt in Weiß eine Burg mit drei Türmen auf rotem Hintergrund. Das Tor ist geschlossen. Der mittlere Turm hat eine Kuppel und ist höher als die beiden äußeren Türme. Oben auf dem mittleren Turm ist ein Kreuz. Über den beiden äußeren Türmen schwebt jeweils ein weißer Stern."],"x":"Das Landeswappen von Baden-Württemberg zeigt drei schreitende schwarze Löwen auf Gold, darüber eine Krone. Die anderen gehören zu anderen Ländern."}},"baden-wuerttemberg-8":{"en":{"q":"Which state is Baden-Württemberg?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies in the southwest of Germany on the western national border. It borders four states.\n\n2. The state lies in the south of Germany on the southwestern national border. It borders three states.\n\n3. The state lies in the middle of Germany in a north-south direction in the western part, but not on the national border. It borders six states.\n\n4. The state lies in the south of Germany on the southeastern national border. It borders four states."],"x":"Baden-Württemberg lies in the south on the southwestern border and neighbours three states: Rhineland-Palatinate, Hesse and Bavaria."},"tr":{"q":"Baden-Württemberg hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın güneybatısında, batı ülke sınırında yer alır. Dört eyaletle komşudur.\n\n2. Eyalet, Almanya'nın güneyinde, güneybatı ülke sınırında yer alır. Üç eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında, kuzey-güney doğrultusunda, batı kesimde yer alır; ancak ülke sınırında değildir. Altı eyaletle komşudur.\n\n4. Eyalet, Almanya'nın güneyinde, güneydoğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Baden-Württemberg güneyde, güneybatı sınırında yer alır ve üç eyaletle komşudur: Rheinland-Pfalz, Hessen ve Bavyera."},"ar":{"q":"أيّ ولاية هي بادن-فورتمبيرغ؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية في جنوب غرب ألمانيا على الحدود الغربية للبلاد. وتجاور أربع ولايات.\n\n2. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الغربية للبلاد. وتجاور ثلاث ولايات.\n\n3. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب في الجزء الغربي، لكنها ليست على حدود البلاد. وتجاور ست ولايات.\n\n4. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الشرقية للبلاد. وتجاور أربع ولايات."],"x":"تقع بادن-فورتمبيرغ في الجنوب على الحدود الجنوبية الغربية وتجاور ثلاث ولايات: راينلاند-بالاتينات وهيسن وبافاريا."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt im Südwesten Deutschlands an der westlichen Staatsgrenze. Es grenzt an vier Bundesländer.\n\n2. Das Bundesland liegt im Süden Deutschlands an der südwestlichen Staatsgrenze. Es grenzt an drei Bundesländer.\n\n3. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland im westlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an sechs Bundesländer.\n\n4. Das Bundesland liegt im Süden Deutschlands an der südöstlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Baden-Württemberg liegt im Süden an der südwestlichen Staatsgrenze und grenzt an drei Länder: Rheinland-Pfalz, Hessen und Bayern."}},"bayern-1":{"en":{"q":"Which coat of arms belongs to the Free State of Bavaria?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows three black lions walking to the left, with red tongues. The background is gold. A golden crown rests on top.","The coat of arms consists of diagonal lozenges in white and blue. A golden crown rests on the coat of arms.","The coat of arms is divided in two. The upper field is striped five times black and yellow. Over it lies a green rue-wreath from lower right to upper left. In the upper right corner is a white field with a black eagle looking to the left. Talons and beak are yellow, the tongue is red. The lower field is white and shows a black bear walking left on a red crenellated wall with black joints and an open gate.","The coat of arms is divided in two. In the left half, against a yellow background, is a black bull's head with a golden crown, an open mouth, white teeth, a red tongue and white horns. In the right half, against a white background, is a red griffin with a yellow beak and claws."],"x":"Bavaria's arms show white and blue lozenges under a golden crown. The other pictures belong to other states."},"tr":{"q":"Bavyera Serbest Eyaleti'ne hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, kırmızı dilli, sola doğru yürüyen üç siyah aslan gösterir. Zemin altın rengindedir. Üstte altın bir taç durur.","Arma, beyaz ve mavi renkli çapraz eşkenar dörtgenlerden oluşur. Armanın üzerinde altın bir taç durur.","Arma ikiye bölünmüştür. Üst alan beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır. Sağ üst köşede, sola bakan siyah bir kartalın bulunduğu beyaz bir alan vardır. Pençeler ve gaga sarı, dil kırmızıdır. Alt alan beyazdır ve kırmızı, siyah derzli, kapısı açık, mazgallı bir surun üzerinde sola doğru yürüyen siyah bir ayı gösterir.","Arma ikiye bölünmüştür. Sol yarıda sarı zemin üzerinde, altın taçlı, ağzı açık, beyaz dişli, kırmızı dilli ve beyaz boynuzlu siyah bir boğa başı vardır. Sağ yarıda beyaz zemin üzerinde, gagası ve pençeleri sarı olan kırmızı bir grifon bulunur."],"x":"Bavyera armasında altın taç altında beyaz ve mavi eşkenar dörtgenler vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية بافاريا الحرة؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار ثلاثة أسود سوداء تمشي نحو اليسار بألسنة حمراء. الخلفية ذهبية، ويعلوه تاج ذهبي.","يتكوّن الشعار من معينات مائلة باللونين الأبيض والأزرق. ويعلو الشعار تاج ذهبي.","الشعار مقسوم إلى قسمين. الحقل العلوي مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب من الأسفل يمينًا إلى الأعلى يسارًا. وفي الزاوية العليا اليمنى حقل أبيض فيه نسر أسود ينظر إلى اليسار، مخالبه ومنقاره صفراء ولسانه أحمر. والحقل السفلي أبيض ويُظهر دبًا أسود يمشي نحو اليسار فوق سور أحمر مسنّن ذي فواصل سوداء وبوابة مفتوحة.","الشعار مقسوم إلى نصفين. في النصف الأيسر، على خلفية صفراء، رأس ثور أسود يعلوه تاج ذهبي، فمه مفتوح وأسنانه بيضاء ولسانه أحمر وقرناه أبيضان. وفي النصف الأيمن، على خلفية بيضاء، غريفون أحمر بمنقار ومخالب صفراء."],"x":"يحمل شعار بافاريا معينات بيضاء وزرقاء يعلوها تاج ذهبي. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen zeigt drei nach links schreitende schwarze Löwen mit roten Zungen. Der Hintergrund des Wappens ist gold. Oben auf dem Wappen ruht eine goldene Krone.  sınırında yer alır. Üç eyaletle komşudur.\n\n3. Eyalet, Almanya'nın ortasında yer alır ve hiçbir ülke sınırında değildir. Beş eyaletle komşudur.\n\n4. Eyalet, Almanya'nın güneyinde, güneydoğu ülke sınırında yer alır. Dört eyaletle komşudur."],"x":"Bavyera, güneydoğuda Avusturya ve Çekya sınırında yer alan büyük eyalettir. Dört eyaletle komşudur."},"ar":{"q":"أيّ ولاية هي بافاريا؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية في وسط ألمانيا بامتداد من الشمال إلى الجنوب في الجزء الغربي، لكنها ليست على حدود البلاد. وتجاور ست ولايات.\n\n2. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الغربية للبلاد. وتجاور ثلاث ولايات.\n\n3. تقع الولاية في قلب ألمانيا وليست على أي حدود للبلاد. وتجاور خمس ولايات.\n\n4. تقع الولاية في جنوب ألمانيا على الحدود الجنوبية الشرقية للبلاد. وتجاور أربع ولايات."],"x":"بافاريا هي الولاية الكبيرة في الجنوب الشرقي على حدود النمسا وتشيكيا، وتجاور أربع ولايات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt in Nord-Süd-Ausrichtung mittig in Deutschland im westlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an sechs Bundesländer.\n\n2. Das Bundesland liegt im Süden Deutschlands an der südwestlichen Staatsgrenze. Es grenzt an drei Bundesländer.\n\n3. Das Bundesland liegt in der Mitte Deutschlands an keiner Staatsgrenze. Es grenzt an fünf Bundesländer.\n\n4. Das Bundesland liegt im Süden Deutschlands an der südöstlichen Staatsgrenze. Es grenzt an vier Bundesländer."],"x":"Bayern ist das große Land im Südosten an der Grenze zu Österreich und Tschechien. Es grenzt an vier Länder."}},"berlin-1":{"en":{"q":"Which coat of arms belongs to the state of Berlin?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows a white castle with three towers on a red background. The gate is closed. The middle tower has a dome and is taller than the two outer towers. On top of the middle tower is a cross. Above each of the two outer towers hovers a white e.\n\n2. The state is small and lies in the southwest of Germany on the national border. It borders one state.\n\n3. The state is small and lies in the middle of Germany in the north, in an east-west direction, but on no national border. It borders two states.\n\n4. The state is small and lies in the eastern part of Germany, but not on the national border. It borders one state."],"x":"Berlin is a small city-state in the east, entirely surrounded by Brandenburg and not on the national border."},"tr":{"q":"Berlin hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet küçüktür ve Almanya'nın kuzeybatı kesiminde yer alır. Bir eyaletle komşudur.\n\n2. Eyalet küçüktür ve Almanya'nın güneybatısında, ülke sınırında yer alır. Bir eyaletle komşudur.\n\n3. Eyalet küçüktür ve Almanya'nın kuzeyinde, doğu-batı doğrultusunda ortada yer alır; ancak hiçbir ülke sınırında değildir. İki eyaletle komşudur.\n\n4. Eyalet küçüktür ve Almanya'nın doğu kesiminde yer alır; ancak ülke sınırında değildir. Bir eyaletle komşudur."],"x":"Berlin, doğuda yer alan, ülke sınırında olmayan ve tamamen Brandenburg ile çevrili küçük bir şehir eyaletidir."},"ar":{"q":"أيّ ولاية هي برلين؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. الولاية صغيرة وتقع في الجزء الشمالي الغربي من ألمانيا. وتجاور ولاية واحدة.\n\n2. الولاية صغيرة وتقع في جنوب غرب ألمانيا على حدود البلاد. وتجاور ولاية واحدة.\n\n3. الولاية صغيرة وتقع في وسط ألمانيا في الشمال بامتداد من الشرق إلى الغرب، لكنها ليست على أي حدود للبلاد. وتجاور ولايتين.\n\n4. الولاية صغيرة وتقع في الجزء الشرقي من ألمانيا، لكنها ليست على حدود البلاد. وتجاور ولاية واحدة."],"x":"برلين ولاية مدينة صغيرة في الشرق، تحيط بها براندنبورغ بالكامل وليست على حدود البلاد."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland ist klein und liegt im nordwestlichen Teil Deutschlands. Es grenzt an ein Bundesland.\n\n2. Das Bundesland ist klein und liegt im Südwesten Deutschlands an der Staatsgrenze. Es grenzt an ein Bundesland.\n\n3. Das Bundesland ist klein und liegt in Ost-West-Ausrichtung mittig in Deutschland im Norden, aber an keiner Staatsgrenze. Es grenzt an zwei Bundesländer.\n\n4. Das Bundesland ist klein und liegt in Deutschland im östlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an ein Bundesland."],"x":"Berlin ist ein kleiner Stadtstaat im Osten, ganz von Brandenburg umschlossen und nicht an der Staatsgrenze."}},"brandenburg-1":{"en":{"q":"Which coat of arms belongs to the state of Brandenburg?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms consists of a red eagle seen from the front, with spread wings, looking to the left. Beak and talons are golden yellow, the tongue is red. The background of the coat of arms is white.","The coat of arms is divided in three. The upper left field consists of a red cross on a white background. The upper right field shows a white wheel with six spokes on a red background. The field at the bottom in the middle shows an upright golden lion facing left on a black background; the lion's tongue and claws are red, and on its head it wears a red crown. A golden crown rests on the coat of arms.","The coat of arms is divided in four. The upper left field shows an upright white lion with a red tongue and a golden crown. The lion is surrounded by white crosses. The background is blue. The upper right field consists of a red cross on a white background. The lower left field shows a red diagonal band running from lower right to upper left. On it are three white eagles. The background is golden. The lower right field shows an upright golden lion with a red crown, red tongue and red claws. The background is black.","The coat of arms shows three black lions walking to the left, with red tongues. The background of the coat of arms is gold. A golden crown rests on top."],"x":"Brandenburg's arms show a red eagle with spread wings on a white background. The other pictures belong to other states."},"tr":{"q":"Brandenburg eyaletine hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, önden görülen, kanatları açık, sola bakan kırmızı bir kartaldan oluşur. Gaga ve pençeler altın sarısı, dil kırmızıdır. Armanın zemini beyazdır.","Arma üçe bölünmüştür. Sol üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sağ üst alan, kırmızı zemin üzerinde altı kollu beyaz bir çark gösterir. Altta ortadaki alan, siyah zemin üzerinde sola dönük, dik duran altın bir aslan gösterir; aslanın dili ve pençeleri kırmızıdır, başında kırmızı bir taç taşır. Armanın üzerinde altın bir taç durur.","Arma dörde bölünmüştür. Sol üst alanda, kırmızı dilli, altın taçlı, dik duran beyaz bir aslan görülür. Aslan beyaz haçlarla çevrilidir. Zemin mavidir. Sağ üst alan, beyaz zemin üzerinde kırmızı bir haçtan oluşur. Sol alt alan, sağ alttan sol üste uzanan kırmızı bir çapraz kuşak gösterir. Üzerinde üç beyaz kartal vardır. Zemin altın rengindedir. Sağ alt alan, kırmızı taçlı, kırmızı dilli ve kırmızı pençeli, dik duran altın bir aslan gösterir. Zemin siyahtır.","Arma, kırmızı dilli, sola doğru yürüyen üç siyah aslan gösterir. Armanın zemini altın rengindedir. Üstte altın bir taç durur."],"x":"Brandenburg armasında beyaz zemin üzerinde kanatları açık kırmızı bir kartal vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ ولاية براندنبورغ؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يتكوّن الشعار من نسر أحمر يُرى من الأمام بجناحين منشورين وينظر إلى اليسار. المنقار والمخالب بلون أصفر ذهبي واللسان أحمر. خلفية الشعار بيضاء.","الشعار مقسوم إلى ثلاثة أقسام. الحقل العلوي الأيسر صليب أحمر على خلفية بيضاء. والحقل العلوي الأيمن عجلة بيضاء بست أشعة على خلفية حمراء. والحقل السفلي في الوسط أسد ذهبي منتصب متجه إلى اليسار على خلفية سوداء، لسانه ومخالبه حمراء ويرتدي على رأسه تاجًا أحمر. ويعلو الشعار تاج ذهبي.","الشعار مقسوم إلى أربعة أقسام. الحقل العلوي الأيسر أسد أبيض منتصب بلسان أحمر وتاج ذهبي، تحيط به صلبان بيضاء، والخلفية زرقاء. والحقل العلوي الأيمن صليب أحمر على خلفية بيضاء. والحقل السفلي الأيسر شريط أحمر مائل يمتد من الأسفل يمينًا إلى الأعلى يسارًا، عليه ثلاثة نسور بيضاء، والخلفية ذهبية. والحقل السفلي الأيمن أسد ذهبي منتصب بتاج أحمر ولسان أحمر ومخالب حمراء، والخلفية سوداء.","يُظهر الشعار ثلاثة أسود سوداء تمشي نحو اليسار بألسنة حمراء. خلفية الشعار ذهبية، ويعلوه تاج ذهبي."],"x":"يحمل شعار براندنبورغ نسرًا أحمر بجناحين منشورين على خلفية بيضاء. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen besteht aus einem roten Adler von vorn mit ausgebreitenten Schwingen und zur linken Seite blickend. Schnabel und Fänge sind gold-gelb, die Zunge rot. Der Hintergrund des Wappens ist weiß.","Das Wappen ist dreigeteilt. Das Feld links oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld rechts oben zeigt ein weißes Rad mit sechs Speichen vor rotem Hintergrund. Das Feld unten in der Mitte zeigt einen nach links gewandten aufrechtstehenden goldenen Löwen vor schwarzem Hintergrund, Zunge und Krallen des Löwen sind rot, auf dem Kopf trägt er eine rote Krone. Auf dem Wappen ruht eine goldene Krone.","Das Wappen ist viergeteilt. Das Feld links oben zeigt einen aufrechtstehenden weißen Löwen mit roter Zunge und goldener Krone. Der Löwe ist von weißen Kreuzen umgeben. Der Hintergrund ist blau. Das Feld rechts oben besteht aus einem roten Kreuz vor weißem Hintergrund. Das Feld links unten zeigt einen roten Schrägbalken, der von rechts unten nach links oben zeigt. Auf ihm sind drei weiße Adler abgebildet. Der Hintergrund ist golden. Das Feld rechts unten zeigt einen aufrechtstehenden goldenen Löwen mit roter Krone, roter Zunge und roten Krallen. Der Hintergrund ist schwarz.","Das Wappen zeigt drei nach links schreitende schwarze Löwen mit roten Zungen. Der Hintergrund des Wappens ist gold. Oben auf dem Wappen ruht eine goldene Krone."],"x":"Das Brandenburger Wappen zeigt einen roten Adler mit ausgebreiteten Schwingen auf Weiß. Die anderen gehören zu anderen Ländern."}},"brandenburg-8":{"en":{"q":"Which state is Brandenburg?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state lies on the northwestern national border of Germany. It borders nine states.\n\n2. The state lies in the middle of Germany in an east-west direction in the northeastern part, but not on the national border. It borders four states.\n\n3. The state lies on the northeastern national border of Germany. It borders three states.\n\n4. The state lies on the eastern national border of Germany. It borders five states."],"x":"Brandenburg lies on the eastern border with Poland and surrounds Berlin. It neighbours five states."},"tr":{"q":"Brandenburg hangi eyalettir?","o":["1","2","3","4"],"g":["Almanya'nın coğrafi haritası görülüyor.\n\n1. Eyalet, Almanya'nın kuzeybatı ülke sınırında yer alır. Dokuz eyaletle komşudur.\n\n2. Eyalet, Almanya'nın ortasında, doğu-batı doğrultusunda, kuzeydoğu kesimde yer alır; ancak ülke sınırında değildir. Dört eyaletle komşudur.\n\n3. Eyalet, Almanya'nın kuzeydoğu ülke sınırında yer alır. Üç eyaletle komşudur.\n\n4. Eyalet, Almanya'nın doğu ülke sınırında yer alır. Beş eyaletle komşudur."],"x":"Brandenburg, doğuda Polonya sınırında yer alır ve Berlin'i çevreler. Beş eyaletle komşudur."},"ar":{"q":"أيّ ولاية هي براندنبورغ؟","o":["1","2","3","4"],"g":["المعروض خريطة جغرافية لألمانيا.\n\n1. تقع الولاية على الحدود الشمالية الغربية لألمانيا. وتجاور تسع ولايات.\n\n2. تقع الولاية في وسط ألمانيا بامتداد من الشرق إلى الغرب في الجزء الشمالي الشرقي، لكنها ليست على حدود البلاد. وتجاور أربع ولايات.\n\n3. تقع الولاية على الحدود الشمالية الشرقية لألمانيا. وتجاور ثلاث ولايات.\n\n4. تقع الولاية على الحدود الشرقية لألمانيا. وتجاور خمس ولايات."],"x":"تقع براندنبورغ على الحدود الشرقية مع بولندا وتحيط ببرلين، وتجاور خمس ولايات."},"de":{"g":["Abgebildet ist eine geografische Karte von Deutschland.\n\n1. Das Bundesland liegt an der nordwestlichen Staatsgrenze Deutschlands. Es grenzt an neun Bundesländer.\n\n2. Das Bundesland liegt in Ost-West-Ausrichtung d.\n\n1. Das Bundesland ist klein und liegt im nordwestlichen Teil Deutschlands. Es grenzt an ein Bundesland.\n\n2. Das Bundesland ist klein und liegt im Südwesten Deutschlands an der Staatsgrenze. Es grenzt an ein Bundesland.\n\n3. Das Bundesland ist klein und liegt in Ost-West-Ausrichtung mittig in Deutschland im Norden, aber an keiner Staatsgrenze. Es grenzt an zwei Bundesländer.\n\n4. Das Bundesland ist klein und liegt in Deutschland im östlichen Teil, aber nicht an der Staatsgrenze. Es grenzt an ein Bundesland."],"x":"Bremen ist ein kleiner Stadtstaat im Nordwesten, vollständig von Niedersachsen umgeben."}},"hamburg-1":{"en":{"q":"Which coat of arms belongs to the Free and Hanseatic City of Hamburg?","o":["Picture 1","Picture 2","Picture 3","Picture 4"],"g":["The coat of arms shows a white horse leaping to the left on a red background.","The coat of arms shows a white castle with three towers on a red background. The gate is closed. The middle tower has a dome and is taller than the two outer towers. On top of the middle tower is a cross. Above each of the two outer towers hovers a white star.","The coat of arms is divided in three. The left field shows a white wavy bar on a green background. The right field shows a leaping white horse on a red background. The lower field is smaller and shows a red blossom with yellow sepals on a white background.","The coat of arms is divided in two. The upper field is striped five times black and yellow. Over it lies a green rue-wreath running from lower right to upper left. In the upper right corner is a white field with a black eagle looking to the left. Talons and beak are yellow, the tongue is red. The lower field is white and shows a black bear walking to the left on a red crenellated wall with black joints and an open gate."],"x":"Hamburg's arms show a white castle with three towers and a closed gate on red. The other pictures belong to other states."},"tr":{"q":"Özgür ve Hansa Kenti Hamburg'a hangi arma aittir?","o":["Resim 1","Resim 2","Resim 3","Resim 4"],"g":["Arma, kırmızı zemin üzerinde sola doğru sıçrayan beyaz bir at gösterir.","Arma, kırmızı zemin üzerinde üç kuleli beyaz bir kale gösterir. Kapı kapalıdır. Ortadaki kulenin bir kubbesi vardır ve yandaki iki kuleden daha yüksektir. Ortadaki kulenin tepesinde bir haç bulunur. Yandaki iki kulenin üzerinde de birer beyaz yıldız asılı durur.","Arma üçe bölünmüştür. Sol alan, yeşil zemin üzerinde beyaz dalgalı bir kuşak gösterir. Sağ alan, kırmızı zemin üzerinde sıçrayan beyaz bir at gösterir. Alttaki alan daha küçüktür ve beyaz zemin üzerinde sarı çanak yapraklı kırmızı bir çiçek gösterir.","Arma ikiye bölünmüştür. Üst alan beş kez siyah ve sarı şeritlidir. Üzerinde, sağ alttan sol üste uzanan yeşil bir sedef otu çelengi yer alır. Sağ üst köşede, sola bakan siyah bir kartalın bulunduğu beyaz bir alan vardır. Pençeler ve gaga sarı, dil kırmızıdır. Alt alan beyazdır ve kırmızı, siyah derzli, kapısı açık, mazgallı bir surun üzerinde sola doğru yürüyen siyah bir ayı gösterir."],"x":"Hamburg armasında kırmızı zemin üzerinde üç kuleli, kapısı kapalı beyaz bir kale vardır. Diğer resimler başka eyaletlere aittir."},"ar":{"q":"أيُّ شعار يخصّ مدينة هامبورغ الحرة والهانزية؟","o":["صورة 1","صورة 2","صورة 3","صورة 4"],"g":["يُظهر الشعار حصانًا أبيض يقفز نحو اليسار على خلفية حمراء.","يُظهر الشعار قلعة بيضاء بثلاثة أبراج على خلفية حمراء. البوابة مغلقة. للبرج الأوسط قبة وهو أعلى من البرجين الخارجيين. وفي أعلى البرج الأوسط صليب. وفوق كل من البرجين الخارجيين تحوم نجمة بيضاء.","الشعار مقسوم إلى ثلاثة أقسام. يُظهر الحقل الأيسر شريطًا أبيض متموجًا على خلفية خضراء. ويُظهر الحقل الأيمن حصانًا أبيض يقفز على خلفية حمراء. أما الحقل السفلي فأصغر ويُظهر زهرة حمراء بسبلات صفراء على خلفية بيضاء.","الشعار مقسوم إلى قسمين. الحقل العلوي مخطّط خمس مرات بالأسود والأصفر، وفوقه إكليل أخضر من أوراق السذاب يمتد من الأسفل يمينًا إلى الأعلى يسارًا. وفي الزاوية العليا اليمنى حقل أبيض فيه نسر أسود ينظر إلى اليسار، مخالبه ومنقاره صفراء ولسانه أحمر. والحقل السفلي أبيض ويُظهر دبًا أسود يمشي نحو اليسار فوق سور أحمر مسنّن ذي فواصل سوداء وبوابة مفتوحة."],"x":"يحمل شعار هامبورغ قلعة بيضاء بثلاثة أبراج وبوابة مغلقة على خلفية حمراء. أما الصور الأخرى فتخص ولايات أخرى."},"de":{"g":["Das Wappen zeigt ein nach links springendes weißes Pferd vor rotem Hintergrund.","Das Wappen zeigt in Weiß eine Burg mit drei Türmen auf rotem Hintergrund. Das Tor ist geschlossen. Der mittlere Turm hat eine Kuppel und ist höher als die beiden äußeren Türme. Oben auf dem mittleren Turm ist ein Kreuz. Über den beiden äußeren Türmen schwebt jeweils ein weißer Stern.","Das Wappen ist dreigeteilt. Das linke Feld zeigt einen weißen gewellten Balken vor grünem Hintergrund. Das rechte Feld zeigt ein springendes weißes Pferd vor rotem Hintergrund. Das untere Feld ist kleiner und zeigt eine rote Blüte mit gelben Kelchblättern vor weißen Hintergrund.","Das Wappen ist zweigeteilt. Das obere Feld ist jeweils fünffach schwarz und gelb gestreift. Darüber liegt von rechts unten nach links oben ein grüner Rautenkranz. In der oberen rechten Ecke befindet sich ein weißes Feld mit einem schwarzen zur linken Seite blickenden Adler. Die Fänge und der Schnabel sind gelb, die Zunge rot. Das untere Feld ist weiß und zeigt einen nach links schreitenden schwarzen Bären auf einer schwarzgefugten, roten Zinnenmauer mit offenem Tor."],"x":"Das Hamburger Wappen zeigt eine weiße Burg mit drei Türmen und geschlossenem Tor auf Rot. Die anderen gehören zu anderen Ländern."}},"hamburg-8":{"en":{"q":"Which state is Hamburg?","o":["1","2","3","4"],"g":["Shown is a geographical map of Germany.\n\n1. The state is small and lies in the northwestern part of Germany. It borders one state.\n\n2. The state is small and lies in the southwest of Germany on the national border. It borders one state.\n\n3. The state is small and lies in the middle of Germany in the north, in an east-west direction, but on no national border. It borders two states.\n\n4. The state is small and lies in the eastern part of German
