name: lid_kocu
description: "LiD Koçu: Almanya vatandaşlık testine dört dilde hazırlık."
publish_to: "none"

# Play'e her yüklemede "+N" kısmını (versionCode) 1 artırın. +1 kapalı teste yüklendi.
version: 1.0.0+2

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.0
  # Tam sürüm sabitlendi (^ yok): billing.dart, completePurchase'ın Android'de BillingResultWrapper Future'ı
  # döndürmesine dayanır (_tekOnay) ve pubspec.lock depoda yok. Yeni sürüm bu davranışı sessizce
  # değiştirebilir; güncellerken billing.dart elle yeniden doğrulanmalı.
  in_app_purchase: 3.3.1
  # 0.5.x = Play Billing Library 8+ (0.5.5: BL 9.1). Play, BL7 içeren yüklemeleri kabul etmiyor.
  in_app_purchase_android: 0.5.5
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
