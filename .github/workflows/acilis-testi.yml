# LiD Koçu — açılış duman testi: Play derlemesiyle aynı ayarlarla (release, R8/minify açık, gerçek AdMob kimliği,
# google-services.json) APK derlenir, Android 14 emülatöründe açılır. Uygulama 15 sn içinde çökerse iş kırmızı olur.
name: Açılış testi

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  acilis:
    name: Emülatörde açılış (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Release APK (Play AAB ile aynı ayarlar, x86_64)
        working-directory: flutter/lid_kocu
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/acilis-testi.sh flutter/lid_kocu/build/app/outputs/flutter-apk/app-release.apk com.lidkocu.app
