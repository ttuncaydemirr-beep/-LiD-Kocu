name: Release AAB (imzalı)

# Yalnızca elle çalışır. Play Store'a yüklenecek imzalı AAB üretir.
# Gerekli GitHub secrets (Ayarlar > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   yükleme anahtarı (.jks) dosyasının base64 hali:  base64 -w0 lidkocu-upload.jks
#   ANDROID_KEYSTORE_PASSWORD depo şifresi
#   ANDROID_KEY_ALIAS         anahtar adı (ör. upload)
#   ANDROID_KEY_PASSWORD      anahtar şifresi
# Hiçbiri yoksa derleme bilerek durur: release'te debug anahtarıyla paket üretilmez.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    name: İmzalı AAB derle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/lid_kocu
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Secrets denetimi
        working-directory: ${{ github.workspace }}
        run: |
          missing=""
          for n in KS_B64:ANDROID_KEYSTORE_BASE64 KS_PASS:ANDROID_KEYSTORE_PASSWORD KEY_ALIAS:ANDROID_KEY_ALIAS KEY_PASS:ANDROID_KEY_PASSWORD; do
            var="${n%%:*}"; secret="${n##*:}"
            if [ -z "${!var}" ]; then missing="$missing $secret"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Eksik secret::Şu GitHub secrets tanımlı değil:$missing. Depo > Settings > Secrets and variables > Actions bölümünden ekleyin (adımlar README.md 'İmzalı yayın'). Release derlemesi debug anahtarıyla üretilmez, bu yüzden duruyor."
            exit 1
          fi
          case "$KEY_PASS$KS_PASS$KEY_ALIAS" in *\\*) echo "::error::Şifre/alias içinde ters eğik çizgi (\\) olmamalı (key.properties bozulur)."; exit 1;; esac

      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version

      - name: Anahtar deposu ve key.properties oluştur
        working-directory: ${{ github.workspace }}
        run: |
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          test -s "$RUNNER_TEMP/upload-keystore.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 çözülemedi veya boş."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::Anahtar deposu açılamadı: depo şifresi veya alias yanlış (ya da base64 bozuk)."; exit 1; }
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > flutter/lid_kocu/android/key.properties

      - run: flutter pub get
      - run: flutter test
      - run: flutter build appbundle --release

      - name: İmzayı doğrula (debug anahtarı olmamalı)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          OUT=$(keytool -printcert -jarfile "$AAB" 2>&1 || true)
          echo "$OUT" | grep -E "Owner:|SHA256:|Valid from" | sed 's/^/  /'
          if echo "$OUT" | grep -qi "Android Debug"; then echo "::error::AAB debug anahtarıyla imzalanmış."; exit 1; fi
          echo "$OUT" | grep -q "Owner:" || { echo "::error::AAB imzası okunamadı."; exit 1; }

      - name: Anahtar dosyalarını sil
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" flutter/lid_kocu/android/key.properties

      - uses: actions/upload-artifact@v5
        with:
          name: lid-kocu-release-aab
          path: flutter/lid_kocu/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
