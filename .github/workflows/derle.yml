# LiD Koçu — her gönderimde: veri kontrolü, Flutter analiz + test, deneme APK ve (anahtar varsa) Play AAB.
# Deneme APK: Releases > "Deneme APK" sayfasından telefona indirilir. Play Store'a yüklenmez.
# Play AAB: Actions > son çalışma > Artifacts > "lid-kocu-play-aab" (GitHub'a giriş gerekir).
# İmza için dört gizli değer (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Firebase (isteğe bağlı): GOOGLE_SERVICES_JSON = google-services.json dosyasının içeriği (düz metin veya base64).
#   Yoksa uygulama Firebase'siz derlenir (Analytics/Remote Config sessizce kapalı).
name: Derle

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  veri:
    name: Veri ve web önizleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Flutter varlıkları web verisiyle aynı mı
        run: |
          python3 web/tools/derle.py
          git diff --exit-code -- flutter/lid_kocu/assets || { echo "::error::flutter/lid_kocu/assets güncel değil: python3 web/tools/derle.py çalıştırıp gönderin"; exit 1; }
      - name: Tasarım renkleri tasarim/tokens.json ile aynı mı
        run: |
          git diff --exit-code -- flutter/lid_kocu/lib/ui/renk.dart web/src/index.html flutter/lid_kocu/android/app/src/main/res || { echo "::error::Renkler tasarim/tokens.json ile aynı değil: renkleri yalnızca tokens.json'da değiştirin, python3 web/tools/derle.py çalıştırıp gönderin"; exit 1; }

  flutter:
    name: Flutter analiz, test ve derleme
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter/lid_kocu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Sabit sürüm: in_app_purchase_android 0.5.x (Billing Library 8+) bu sürümle çözülür.
          flutter-version: 3.47.9
          cache: true
      - run: flutter --version

      - name: Firebase yapılandırması (GOOGLE_SERVICES_JSON varsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "::notice::android/app/google-services.json depoda var, o kullanılıyor."
            exit 0
          fi
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::notice::GOOGLE_SERVICES_JSON yok: Firebase'siz derleniyor (Analytics/Remote Config kapalı)."
            exit 0
          fi
          case "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)" in
            "{") printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json ;;
          esac
          python3 -c "import json,sys; d=json.load(open('android/app/google-services.json')); ok=any(c.get('client_info',{}).get('android_client_info',{}).get('package_name')=='com.lidkocu.app' for c in d.get('client',[])); sys.exit(0 if ok else 1)" \
            || { echo "::error::google-services.json geçersiz veya com.lidkocu.app paketi için değil"; exit 1; }
          echo "google-services.json yazıldı."

      - run: flutter pub get

      - name: Analiz
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter github

      - name: Deneme APK
        run: |
          set -o pipefail
          # Deneme APK'sı Google'ın TEST reklamlarıyla derlenir (yerleşim telefonda görülsün). Play AAB'si gerçek kimlikleri kullanır.
          flutter build apk --release --dart-define=TEST_REKLAM=true 2>&1 | tee apk.log || { tail -25 apk.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=APK derlemesi::/'; echo; exit 1; }
          cp build/app/outputs/flutter-apk/app-release.apk LiD-Kocu-deneme.apk

      - uses: actions/upload-artifact@v5
        with:
          name: lid-kocu-deneme-apk
          path: flutter/lid_kocu/LiD-Kocu-deneme.apk
          retention-days: 14

      - name: Deneme APK sürümünü güncelle
        # Yalnızca main: başka dallardaki denemeler Releases'teki APK'yı değiştirmez (APK yine Artifacts'ta).
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Telefonda denemek için otomatik derlenen APK (commit ${GITHUB_SHA::7}). Play Store'a yüklenmez; satın alma bu dosyada çalışmaz."
          if gh release view deneme-apk >/dev/null 2>&1; then
            gh release upload deneme-apk LiD-Kocu-deneme.apk --clobber
            gh release edit deneme-apk --notes "$NOTES" --prerelease
          else
            gh release create deneme-apk LiD-Kocu-deneme.apk --title "Deneme APK" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

      - name: Yükleme anahtarını yerleştir
        id: anahtar
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::İmza anahtarı eklenmemiş: Play'e yüklenecek AAB üretilmedi (README > İmza anahtarı)."
            echo "var=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "var=true" >> "$GITHUB_OUTPUT"

      - name: Play AAB
        if: steps.anahtar.outputs.var == 'true'
        run: |
          set -o pipefail
          # AdMob kimlikleri boşsa uyar (derleme kırılmaz): bu AAB'de reklam yüklenmez.
          for k in admobUygulamaKimligi bannerBirimi gecisBirimi odulluBirimi; do
            if grep -Eq "const String $k = '\s*';" lib/services/reklam_ayar.dart; then
              echo "::warning title=AdMob kimliği boş::lib/services/reklam_ayar.dart içinde $k boş. Bu Play AAB'sinde reklam gösterilmez."
            fi
          done
          flutter build appbundle --release 2>&1 | tee aab.log || { tail -25 aab.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=AAB derlemesi::/'; echo; exit 1; }
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr '+' '-')
          cp build/app/outputs/bundle/release/app-release.aab "LiD-Kocu-$V.aab"
          rm -f android/upload.jks android/key.properties android/app/google-services.json

      - uses: actions/upload-artifact@v5
        if: steps.anahtar.outputs.var == 'true'
        with:
          name: lid-kocu-play-aab
          path: flutter/lid_kocu/LiD-Kocu-*.aab
          retention-days: 30

  # Açılış duman testi: Play derlemesiyle aynı ayarlarla (release, R8/minify açık, gerçek AdMob kimliği,
  # google-services.json) APK derlenir ve Android 14 emülatöründe açılır. 15 sn içinde çökerse iş kırmızı olur.
  acilis:
    name: Emülatörde açılış (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Release APK (Play AAB ile aynı ayarlar, x86_64)
        working-directory: flutter/lid_kocu
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-x64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/acilis-testi.sh flutter/lid_kocu/build/app/outputs/flutter-apk/app-release.apk com.lidkocu.app

